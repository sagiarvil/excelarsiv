name: Publish QA-Approved Excel Products

on:
  push:
    branches: [main]
    paths:
      - 'tools/excelarsiv_publish_ready_products.py'
      - 'EXCELARSIV_PRODUCTS/_SYSTEM/MANIFEST/quality_manifest.csv'
      - 'EXCELARSIV_PRODUCTS/*/QA/audit.json'
      - 'EXCELARSIV_PRODUCTS/*/SPEC.yaml'
      - 'EXCELARSIV_PRODUCTS/*/KANIT/SEVK_KARARI.md'
      - 'public/screenshots/**'
      - '.github/workflows/excelarsiv-publish-ready-products.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Generate only evidence-backed catalog entries
        run: |
          python tools/excelarsiv_publish_ready_products.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Validate Astro content and routes
        run: npx astro build

      - name: Commit catalog entries and publication evidence
        run: |
          git config user.name "excelarsiv-publisher-bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add src/content/templates EXCELARSIV_PRODUCTS/_SYSTEM/PUBLISH
          if git diff --cached --quiet; then
            echo "No publishable catalog changes."
          else
            git commit -m "feat(catalog): publish QA-approved Excel products [skip ci]"
            git push
          fi

      - name: Show publication manifest
        run: cat EXCELARSIV_PRODUCTS/_SYSTEM/PUBLISH/publication_manifest.json
