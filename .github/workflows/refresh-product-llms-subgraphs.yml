name: Refresh Product LLM Subgraphs

on:
  push:
    branches:
      - 'release/qa-approved-catalog-20260921'
    paths:
      - '.github/workflows/refresh-product-llms-subgraphs.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate product subgraphs
        run: npx tsx scripts/seo/generate-product-subgraphs.ts

      - name: Verify answer graph
        run: npx tsx scripts/seo/validate-answer-graph.ts

      - name: Commit generated LLM pages
        run: |
          git config user.name "excelarsiv-llms-bot"
          git config user.email "llms-bot@users.noreply.github.com"
          git add public/llms/pages
          if git diff --cached --quiet; then
            echo "No LLM page changes."
          else
            git commit -m "feat(llms): generate product subgraphs for QA-approved catalog"
            git push
          fi
