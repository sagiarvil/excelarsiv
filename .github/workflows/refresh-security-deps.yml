name: Refresh Patched Astro Dependency Set

on:
  push:
    branches:
      - 'release/qa-approved-catalog-20260921'
    paths:
      - '.github/workflows/refresh-security-deps.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Refresh Astro to patched security release
        run: |
          npm install --save-exact astro@7.2.8
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const required = {
            astro: ['node_modules/astro', '7.2.8'],
            sharp: ['node_modules/sharp', '0.35.4'],
            jsYaml: ['node_modules/js-yaml', '4.3.2'],
            svgo: ['node_modules/svgo', '4.1.0'],
          };
          for (const [name, [key, min]] of Object.entries(required)) {
            const got = lock.packages?.[key]?.version;
            if (got !== min) {
              console.error(`PATCHED_DEPENDENCY_NOT_LOCKED:${name}: expected=${min} got=${got}`);
              process.exit(1);
            }
          }
          console.log('Patched dependency set verified.');
          NODE

      - name: Commit patched dependency lock
        run: |
          git config user.name "excelarsiv-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes."
          else
            git commit -m "fix(security): upgrade Astro dependency set to patched releases"
            git push
          fi
