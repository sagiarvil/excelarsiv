name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh Functions lock from declared security overrides
        run: timeout 120s npm install --prefix functions --package-lock-only --ignore-scripts
      - name: Verify patched fast-uri lock
        run: node -e "const l=require('./functions/package-lock.json');const v=l.packages?.['node_modules/fast-uri']?.version;if(!v||/^3\.1\.[0-5]$/.test(v)){console.error('unpatched fast-uri',v);process.exit(1)}console.log('fast-uri',v)"
      - name: Upload refreshed Functions lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-functions-package-lock
          path: functions/package-lock.json
          if-no-files-found: error
          retention-days: 2
      - id: site_audit
        name: Audit site production dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 120s npm audit --omit=dev --audit-level=high 2>&1 | tee security-site-audit.log
      - name: Upload site audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-site-audit-diagnostics
          path: security-site-audit.log
          if-no-files-found: error
          retention-days: 2
      - name: Fail on site dependency audit
        if: steps.site_audit.outcome == 'failure'
        run: cat security-site-audit.log && exit 1
      - id: functions_audit
        name: Audit Functions production dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 120s npm audit --prefix functions --omit=dev --audit-level=high 2>&1 | tee security-functions-audit.log
      - name: Upload Functions audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-functions-audit-diagnostics
          path: security-functions-audit.log
          if-no-files-found: error
          retention-days: 2
      - name: Fail on Functions dependency audit
        if: steps.functions_audit.outcome == 'failure'
        run: cat security-functions-audit.log && exit 1
      - name: Generate SBOM
        run: npm run sbom
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excelarsiv-sbom
          path: sbom/
          if-no-files-found: error

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Functions lock from declared security overrides
        run: timeout 120s npm install --prefix functions --package-lock-only --ignore-scripts
      - id: trivy_scan
        name: Trivy filesystem security scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-security.log
          skip-dirs: node_modules,dist,.git
      - name: Upload Trivy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-diagnostics
          path: trivy-security.log
          if-no-files-found: error
          retention-days: 2
      - name: Fail on Trivy findings
        if: steps.trivy_scan.outcome == 'failure'
        run: cat trivy-security.log && exit 1
