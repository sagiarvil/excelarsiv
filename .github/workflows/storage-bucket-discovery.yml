name: storage-bucket-discovery

on:
  push:
    branches: [fix/storage-bucket-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Prove dedicated private paid-product bucket
        shell: bash
        run: |
          set -euo pipefail
          project='carbon-web-1265b'
          bucket='gs://carbon-web-1265b-paid-products-eu'

          gcloud storage buckets describe "$bucket" --project "$project" >/dev/null
          gcloud storage buckets update "$bucket" --pap --uniform-bucket-level-access

          printf 'excelarsiv-private-storage-probe\n' >/tmp/storage-probe.txt
          gcloud storage cp /tmp/storage-probe.txt "$bucket/.release-probe.txt"
          gcloud storage cat "$bucket/.release-probe.txt" | grep -Fx 'excelarsiv-private-storage-probe'
          gcloud storage rm "$bucket/.release-probe.txt"

          gcloud storage buckets describe "$bucket" --format='yaml(name,location,uniformBucketLevelAccess,publicAccessPrevention)'
