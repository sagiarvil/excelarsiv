name: storage-bucket-discovery

on:
  push:
    branches: [fix/storage-bucket-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Create and harden private paid-product bucket
        shell: bash
        run: |
          set -euo pipefail
          project='carbon-web-1265b'
          bucket='gs://carbon-web-1265b-paid-products-eu'
          runtime_sa='7943100684-compute@developer.gserviceaccount.com'
          ci_sa="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));process.stdout.write(x.client_email)")"

          if ! gcloud storage buckets describe "$bucket" --project "$project" >/dev/null 2>&1; then
            gcloud storage buckets create "$bucket" \
              --project "$project" \
              --location europe-west1 \
              --uniform-bucket-level-access \
              --public-access-prevention
          fi

          gcloud storage buckets update "$bucket" --public-access-prevention=enforced --uniform-bucket-level-access
          gcloud storage buckets add-iam-policy-binding "$bucket" \
            --member="serviceAccount:${runtime_sa}" \
            --role='roles/storage.objectViewer'
          gcloud storage buckets add-iam-policy-binding "$bucket" \
            --member="serviceAccount:${ci_sa}" \
            --role='roles/storage.objectAdmin'

          printf 'excelarsiv-private-storage-probe\n' >/tmp/storage-probe.txt
          gcloud storage cp /tmp/storage-probe.txt "$bucket/.release-probe.txt"
          gcloud storage cat "$bucket/.release-probe.txt" | grep -Fx 'excelarsiv-private-storage-probe'
          gcloud storage rm "$bucket/.release-probe.txt"

          gcloud storage buckets describe "$bucket" --format='yaml(name,location,uniformBucketLevelAccess,publicAccessPrevention)'
