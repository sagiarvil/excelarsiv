name: storage-code-fix

on:
  push:
    branches: [fix/storage-bucket-discovery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'wire dedicated paid-product bucket')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-bucket-discovery
      - name: Patch production bucket wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'carbon-web-1265b.firebasestorage.app'
          new = 'carbon-web-1265b-paid-products-eu'
          paths = [
              Path('scripts/sync-paid-products.mjs'),
              Path('scripts/check-paid-products.mjs'),
              Path('.github/workflows/deploy-firebase.yml'),
          ]
          changed = 0
          for p in paths:
              s = p.read_text()
              n = s.count(old)
              if n:
                  p.write_text(s.replace(old, new))
                  changed += n
          p = Path('functions/index.js')
          s = p.read_text()
          old_init = 'initializeApp();'
          new_init = "initializeApp({ storageBucket: process.env.STORAGE_BUCKET || 'carbon-web-1265b-paid-products-eu' });"
          if new_init not in s:
              if s.count(old_init) != 1:
                  raise SystemExit(f'expected one initializeApp();, found {s.count(old_init)}')
              p.write_text(s.replace(old_init, new_init, 1))
              changed += 1

          remaining = []
          for p in [Path('scripts/sync-paid-products.mjs'), Path('scripts/check-paid-products.mjs'), Path('.github/workflows/deploy-firebase.yml'), Path('functions/index.js')]:
              if old in p.read_text(): remaining.append(str(p))
          if remaining:
              raise SystemExit('legacy nonexistent bucket remains: ' + ', '.join(remaining))
          if changed == 0:
              print('Production bucket wiring already applied')
          else:
              print(f'Applied {changed} exact bucket/init replacements')
          PY
          git diff --check
          git diff -- scripts/sync-paid-products.mjs scripts/check-paid-products.mjs functions/index.js .github/workflows/deploy-firebase.yml
      - name: Commit production bucket wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/sync-paid-products.mjs scripts/check-paid-products.mjs functions/index.js .github/workflows/deploy-firebase.yml; then
            echo 'No production patch required.'
            exit 0
          fi
          git config user.name 'sagiarvil-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync-paid-products.mjs scripts/check-paid-products.mjs functions/index.js .github/workflows/deploy-firebase.yml
          git commit -m 'fix: wire dedicated paid-product bucket'
          git push origin HEAD:fix/storage-bucket-discovery
