name: storage-code-fix

on:
  push:
    branches: [fix/storage-bucket-discovery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'wire dedicated paid-product bucket')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-bucket-discovery
      - name: Patch production bucket wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy = 'carbon-web-1265b.firebasestorage.app'
          target = 'carbon-web-1265b-paid-products-eu'
          changed = 0

          for name in ['scripts/sync-paid-products.mjs', 'scripts/check-paid-products.mjs']:
              p = Path(name)
              s = p.read_text()
              old = f"const bucketName = process.env.STORAGE_BUCKET || '{legacy}';"
              new = f"const requestedBucket = process.env.STORAGE_BUCKET;\nconst bucketName = !requestedBucket || requestedBucket === '{legacy}' ? '{target}' : requestedBucket;"
              if new not in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'{name}: expected one legacy bucket declaration, found {s.count(old)}')
                  p.write_text(s.replace(old, new, 1))
                  changed += 1

          p = Path('functions/index.js')
          s = p.read_text()
          old_init = 'initializeApp();'
          new_init = f"initializeApp({{ storageBucket: '{target}' }});"
          if new_init not in s:
              if s.count(old_init) != 1:
                  raise SystemExit(f'functions/index.js: expected one initializeApp();, found {s.count(old_init)}')
              p.write_text(s.replace(old_init, new_init, 1))
              changed += 1

          print(f'Applied {changed} production bucket changes')
          PY
          git diff --check
          git diff -- scripts/sync-paid-products.mjs scripts/check-paid-products.mjs functions/index.js
      - name: Commit production bucket wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/sync-paid-products.mjs scripts/check-paid-products.mjs functions/index.js; then
            echo 'No production patch required.'
            exit 0
          fi
          git config user.name 'sagiarvil-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync-paid-products.mjs scripts/check-paid-products.mjs functions/index.js
          git commit -m 'fix: wire dedicated paid-product bucket'
          git push origin HEAD:fix/storage-bucket-discovery
