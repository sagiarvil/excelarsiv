name: Sync SEO Registry For Published Catalog

on:
  push:
    branches:
      - 'release/qa-approved-catalog-20260921'
    paths:
      - '.github/workflows/sync-seo-registry-published.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync registry to published template routes
        run: |
          node --experimental-strip-types scripts/seo/registry-sync-missing.ts
          node --experimental-strip-types scripts/seo/registry-source-parity.ts

      - name: Commit registry evidence
        run: |
          git config user.name "excelarsiv-registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add data/seo/registry/excelarsiv_seo_registry.json
          if git diff --cached --quiet; then
            echo "No registry changes."
          else
            git commit -m "chore(seo): register QA-approved catalog routes"
            git push
          fi
