name: Temporary Service Page Refinement

on:
  push:
    branches:
      - fix/ozel-sistemler-content-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ozel-sistemler-content-v2
          fetch-depth: 0

      - name: Apply requested page changes
        run: python3 scripts/tmp-refine-ozel-sistemler.py

      - name: Commit generated page revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ozel-excel-sistemleri.astro
          git diff --cached --quiet && exit 0
          git commit -m "fix(service): apply requested content revisions"
          git push origin HEAD:fix/ozel-sistemler-content-v2
