name: Temporary CTA Heading Patch

on:
  push:
    branches:
      - fix/cta-heading-ihtiyaca-yonelik

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cta-heading-ihtiyaca-yonelik
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/tmp-update-cta-heading.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ozel-excel-sistemleri.astro
          git diff --cached --quiet && exit 0
          git commit -m "fix(service): use need-based Excel tables CTA heading"
          git push origin HEAD:fix/cta-heading-ihtiyaca-yonelik
