  karar: "Asgari ücret zammının işçilik maliyetine etkisini çalışan bazında hesaplar; maliyet artışını ürün/hizmet fiyatlarına yansıtmak için fiyat ayarlama cetveli üretir ve UYGUN / İNCELE / DURDUR kararı verir"
