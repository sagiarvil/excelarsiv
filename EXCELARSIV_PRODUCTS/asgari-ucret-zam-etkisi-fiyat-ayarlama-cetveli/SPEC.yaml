    - "Asgari Ücret Yönetmeliği: asgari ücret tespiti ve yürürlük; zam duyurusu sonrası ücret uyarlaması"
    - "Kıdem tazminatı tavanı (1475 s. md.14) asgari ücret zammından etkilenir; maliyet hesabında gözetilir"
  giris:
