urun:
  slug: asiri-dusuk-teklif-savunma-robotu
  ad: "İhale Elinden Gidiyor Mu? (Aşırı Düşük Teklif Savunma Robotu)"
  karar: "Teklifin aşırı düşük kapsamına girip girmediğini tespit etmek; giriyorsa kabul edilebilir açıklama setini ve güçlendirme aksiyonlarını üretmek"
  hedef_kullanici: "Yapım işi ve mal alımı ihalelerine giren müteahhit, yüklenici ve teklif hazırlayan firmalar"
  mevzuat:
    - "4734 sayılı Kamu İhale Kanunu md.38: sınır değer altı teklifler aşırı düşük sayılır, açıklama istenir"
    - "Yapım İşleri İhaleleri Uygulama Yönetmeliği md.61-62: sınır değer hesabı ve sınır değer katsayısı (N)"
    - "Kamu İhale Genel Tebliği ve KİK İşçilik Analizleri Tebliği: açıklama bileşenleri ve dayanak esasları"
  giris:
    ihale_karti:
      alanlar: [ihaleAdi, idare, ihaleTarihi, yaklasikMaliyet, sinirDegerYontem, sinirDegerKatsayisi, kendiTeklifTutari, fiyatFarkiMaddeVarMi]
    rakip_teklifler:
      tablo: tblRakipler
      kolonlar: [rakipAdi, teklifTutari, gecerliMi]
    teklif_bilesenleri:
      tablo: tblBilesenler
      kolonlar: [kalemAdi, birim, miktar, birimFiyat, rayicBirimFiyat, dayanakTuru]
  esikler:
    asiri_dusuk_esik: 1.00        # teklif/sınır değer oranı < 1,00 → AÇIKLAMA GEREKİR
    dikkat_esik: 1.05             # güvenlik payı %5'in altı → DİKKAT bölgesi
    anomali_z_esigi: 2.00         # bileşen birim fiyatı rayiçten |Z|>2 saparsa bayrak
    dayanak_esik: 0.80            # açıklanan bileşenlerin toplam ağırlığı < %80 ise savunma zayıf
  rapor: "A4, PDF'e hazır; yönetici özeti, sınır değer karşılaştırması, açıklama dayanak listesi ve risk çekinceleri"

