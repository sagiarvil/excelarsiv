urun:
  slug: aylik-patron-finans-paneli
  ad: "Aylık Patron Finans Paneli"
  karar: "İşletmenin finansal durumunu kâr, borçluluk ve kasa yeterliliğine göre UYGUN/İNCELE/DURDUR kararıyla özetler; kayıt yetersizse VERİ YOK der"
  hedef_kullanici: "KOBİ sahipleri, patronlar, genel müdürler, finans yöneticileri, mali müşavirler"
  mevzuat:
    - "VUK (213 s.) md.182-198: defter tutma ve kayıt düzeni; gelir-gider kayıtlarının dayanağı"
  giris:
    aylik_gelir_gider:
      tablo: tblAylikGelirGider
      kolonlar: ["Dönem", "Kalem", "Tür", "Tutar (₺)", "Nakit mi?", "Not"]
    borc_ve_alacak:
      tablo: tblBorcAlacak
      kolonlar: ["Tür", "Kurum/Müşteri", "Açıklama", "Güncel Bakiye (₺)", "Kalan Taksit", "Vade Tarihi", "Not"]
    aylik_ozet:
      tablo: tblAylikOzet
      kolonlar: ["Dönem", "Gelir TL", "Gider TL", "Net TL", "Nakit Akışı TL", "Nakit Oranı %"]
  esikler:
    asgari_veri_sayisi: 6
    borc_gelir_esik: 0.75
    kasa_gider_esik: 1
    asgari_ay_sonu_kasa: 250000
  rapor: "A4, PDF'e hazır; genel karar, KPI özeti, varsayımlar ve önerilen aksiyonlar"

