serbest_alternatif:
  alternatifler:
    - "Gelir-gideri ayrı ayrı el ile tutulan dağınık hesap tablosu"
    - "Mali müşavirden aylık finansal durum özeti"
    - "Ücretsiz genel amaçlı gelir-gider şablonları (borçluluk ve nakit yeterliliği ölçmez)"
    - "Kârı nakit akışıyla karıştırıp dönem sonunu sürprizle karşılamak"
    - "Her ay farklı kişiden alınan elle hazırlanmış rapor"
  ayrimlar:
    - madde: "Tahakkuk kârı ile nakit akışını ayrıştırıp dönem nakit farkını ölçer"
      karsilik: modulT5TahakkukNakitFark
    - madde: "Kâr, borçluluk ve kasa yeterliliğine göre gerekçeli UYGUN/İNCELE/DURDUR kararı üretir; veri azsa VERİ YOK der"
      karsilik: KararBildirimi
    - madde: "Vadesi geçen borçları rapor tarihine göre otomatik yaşlandırır"
      karsilik: modulT1YasliBorc
    - madde: "İyimser/kötümser senaryo ve tornado duyarlılıkla sonucu en çok etkileyen değişkeni sıralar"
      karsilik: modulO2GelirEtki
    - madde: "Aylık nakit açığı ve kasa eşiğiyle dönem sonunu önceden görür"
      karsilik: modulI7NakitAcigi
    - madde: "Kalite skoruyla eksik veri girişini ölçer, rapor güvenilirliğini gösterir"
      karsilik: modulO8KaliteSkor

