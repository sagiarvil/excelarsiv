urun:
  slug: cari-hesap-tahsilat-ve-musteri-risk-takip-sistemi
  ad: "Cari Hesap, Tahsilat ve Müşteri Risk Takip Sistemi"
  karar: "Hangi müşteriye vadeli satışın durdurulacağını, kimin limitinin azaltılacağını ve hangi tahsilat aksiyonunun öncelikli olduğunu makine üretimi risk skoruyla belirler; veri yetersizse VERİ YOK der"
