      kolonlar: ["Takip Kayıt Numarası", "Tarih", "Müşteri Kodu", "Yetkili Kişi", "Kanal", "Görüşme Sonucu", "Söz Verilen Tarih", "Söz Verilen Tutar", "Sonraki Aksiyon", "Sorumlu"]
  esikler:
