      kolonlar: ["Teminat Kayıt Numarası", "Müşteri Kodu", "Teminat Türü", "Belge Numarası", "Başlangıç Tarihi", "Geçerlilik Tarihi", "Nominal Değer", "Değerleme İndirimi", "Para Birimi"]
    iletisim:
