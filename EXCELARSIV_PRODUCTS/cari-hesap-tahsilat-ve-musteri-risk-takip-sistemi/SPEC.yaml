  mevzuat:
    - "VUK (213 s.) md.182-198: defter tutma ve kayıt düzeni; cari hesap kayıtlarının dayanağı"
  giris:
    musteri_kartlari:
      tablo: tblMusteriler
      kolonlar: ["Müşteri Kodu", "Unvan", "Vergi Numarası", "Sektör", "Bölge", "Satış Sorumlusu", "İlk Çalışma Tarihi", "Varsayılan Vade", "Onaylı Risk Limiti", "Geçici Ek Limit", "Limit Bitiş Tarihi", "Teminat Türü", "Teminat Değeri", "Teminat Geçerlilik Tarihi", "Grup Şirketi", "Kritik Müşteri mi?", "Durum"]
    faturalar:
      tablo: tblFaturalar
      kolonlar: ["Fatura Kayıt Numarası", "Fatura Numarası", "Müşteri Kodu", "Fatura Tarihi", "Vade Tarihi", "Fatura Tutarı", "Para Birimi", "Kur", "İade/İskonto", "İtirazlı Tutar", "Teminat Kapsamı", "Proje/Sipariş", "Satış Sorumlusu", "Belge Durumu"]
    tahsilatlar:
      tablo: tblTahsilatlar
      kolonlar: ["Tahsilat Kayıt Numarası", "Tarih", "Müşteri Kodu", "Fatura Numarası", "Tahsilat Tutarı", "Ödeme Türü", "Banka/Kasa", "Çek/Senet Numarası", "Valör Tarihi", "Açıklama"]
    teminatlar:
