      karsilik: MaxAcik
    - madde: "Müşteri bazında yoğunlaşma payını hesaplayarak tek müşteri riskini gösterir"
      karsilik: modulT3Yogunlasma
    - madde: "Vadesi geçen alacakların finansman maliyetini TL olarak hesaplar"
      karsilik: modulO5GecikmeMaliyeti
    - madde: "Veri yetersizse karar üretmez, VERİ YOK der; boş dosyada 'UYGUN' demez"
      karsilik: KayitSayisi

