urun:
  slug: cek-senet-vade-risk-sistemi
  ad: "Çek Senet Vade ve Karşılık Risk Sistemi"
  karar: "Alınan/verilen çek ve senetlerin vade takvimini, risk ağırlıklı tahsil değerini ve günlük karşılık açığını hesaplar; karşılık oranı ve vade yoğunluğuna göre KRİTİK/RİSKLİ/NORMAL kararı üretir; veri yetersizse VERİ YOK der"
  hedef_kullanici: "Finans ve nakit yönetimi uzmanları, muhasebe yöneticileri, kobi sahipleri, kredi risk uzmanları"
  mevzuat:
    - "Türk Ticaret Kanunu (6102 s.) md.772-778: kambiyo senetlerinde ibraz ve ödeme süreleri"
    - "Çek Kanunu (5941 s.): karşılıksız çek ve ibraz süreleri (10 gün)"
    - "MASAK ve bankacılık uygulamalarında çek hesabı bilgilerinin doğrulanması"
  giris:
    cari_kartlari:
      tablo: tblCari
      kolonlar: ["Cari Kodu", "Unvan", "Yetkili", "Telefon", "Şehir", "Tür", "Skor", "Durum", "Risk Sınıfı", "Kredi Limiti", "Not"]
    belgeler:
      tablo: tblCekSenet
      kolonlar: ["Belge ID", "Belge Türü", "Belge Numarası", "Yön", "Düzenleyen", "Lehtar", "Cari Kodu", "Keşide Tarihi", "Vade Tarihi", "Tutar", "Para Birimi", "Kur", "TL Tutar", "Banka", "Şube", "Hesap", "Teminat Durumu", "Ciro Edildi", "Ciro Edilen Cari", "Portföy Durumu", "Tahsil Bankası", "Tahsile Veriliş Tarihi", "Son Durum", "Son Durum Tarihi", "Risk Sınıfı", "Karşılıksız Bilgisi", "Hukuki Takip", "Sorumlu", "Not", "Mükerrer Kontrol", "Risk Ağırlığı", "Risk Ağırlıklı TL", "Cari Risk Sınıfı"]
    ciro_zinciri:
      tablo: tblCiro
      kolonlar: ["Ciro Kayıt No", "Belge Numarası", "Ciro Tarihi", "Ciro Edilen Cari", "Sorumluluğu Devam Ediyor", "Not"]
    banka_tahsilati:
      tablo: tblBankaTahsil
      kolonlar: ["Tahsil No", "Tarih", "Banka", "Belge Numarası", "Durum", "Tahsil Tutarı", "Karşılık Açığı", "Not"]
    durum_hareketleri:
      tablo: tblDurumHareket
      kolonlar: ["Hareket No", "Belge Numarası", "Tarih", "Önceki Durum", "Yeni Durum", "Açıklama", "Sorumlu"]
  esikler:
    asgari_veri_sayisi: 6
    esik_izle: 49
    esik_kritik: 70
  rapor: "A4, PDF'e hazır; genel karar, KPI özeti, varsayımlar ve önerilen aksiyonlar"

