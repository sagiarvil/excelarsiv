    - "Sadece bakiye doğrulayan banka mutabakat çıktısı (vade yoğunluğu görünmez)"
    - "Karşılıksız riski için hiçbir skorlamanın yapılmadığı sezgisel takip"
    - "Alınan belgelerin nominal toplamının 'tahsil olacak' sanıldığı basit toplam"
