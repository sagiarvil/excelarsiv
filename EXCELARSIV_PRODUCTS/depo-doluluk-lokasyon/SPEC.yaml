  - VARLIKLAR
  - GUNLUK_GIRIS
  - DONEM_ANALIZ
  - HESAP
  - PANO
  - ALARMLAR
  - RAPOR
  - KONTROLLER
  - ORNEK_VERI
  - LISTELER
  - AYARLAR
  - KILAVUZ

