  aciklama: "Kampanya / indirim dönemi öncesi −7 gün veya komisyon değişiminde"
  tarih_penceresi: "kampanya_oncesi_7_gun"

rakip_ayrim:
  - sinif: R3_saas
    ayrim: "Tek seferlik alım, aylık abonelik yok"
    karsilik: "egk_fiyatModeli"
  - sinif: R3_saas
    ayrim: "Veri cihazdan çıkmaz"
    karsilik: "egk_kvkkBeyani"
  - sinif: R1_jenerik
    ayrim: "Başabaş fiyat + net kâr + karar tek motorda"
    karsilik: "egk_basabasFiyat"
  - sinif: R1_jenerik
    ayrim: "SKU eşleştirme ile katalog↔platform gerçek kâr"
    karsilik: "egk_eslesmeOrani"
  - sinif: R1_jenerik
    ayrim: "EGK kök neden + TANIMSIZ kova"
    karsilik: "egk_tanimsizKova"

serbest_alternatif:
  soru: "Alıcı bunu bedavaya nasıl yapar?"
  adaylar:
    - "Elle komisyon/kargo/reklam Exceli"
    - "Pazaryeri panosu + hesap makinesi"
    - "Muhasebecinin dönem kâr özeti"
  ayrimlar:
    - madde: "SKU normalize + duplike denetimli eşleştirme"
      karsilik: "egk_normAnahtar"
    - madde: "Dört kova bütünlüğü (hedef↔gerçek kâr)"
      karsilik: "egk_kovaButunluk"
    - madde: "TANIMSIZ kök-neden kovası görünür"
      karsilik: "egk_tanimsizKova"
    - madde: "Eşleşme oranı veriden türer"
      karsilik: "egk_eslesmeOrani"
    - madde: "50.000 satır ölçek sözleşmesi"
      karsilik: "egk_olcekHedef"

anahtar_stratejisi:
  birincil: "UPPER(TRIM(SUBSTITUTE(urun_kodu,\" \",\"\")))"
  ikincil: "LEFT(norm,12) veya platform+kod"
  kisa_uzun_senaryo: true

mutabakat:
  tolerans_kurus: 0.05
  kova_kurallari: [eslesti, tolerans_icinde, tutar_farki, eslesmedi]

kurallar:
  - EGK-001
  - EGK-002
  - EGK-003
  - EGK-004
  - EGK-005

