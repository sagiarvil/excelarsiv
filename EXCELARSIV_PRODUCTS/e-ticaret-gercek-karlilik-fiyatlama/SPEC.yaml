  ad: "E-Ticaret Gerçek Kârlılık & Fiyatlama"
  surum: "1.0.0"
  satis_fiyati_tl: 4900
  hedef_kullanici: "E-ticaret işletmecisi, pazaryeri satıcısı, mali işler"

arketip: A2
fiyat: 4900
olcek_hedefi: 50000

deger:
  satis_fiyati_tl: 4900
  Y1_danisman_ikamesi_tl: 12000
  Y2_kurulum_ikamesi_tl: 5000
  Y3_onlenen_hata_tl: 18000
  Y4_saas_yillik_ikamesi_tl: 6000
  kaynak: "Ürün bazlı gerçek kâr danışmanlığı + fiyatlama model kurulum"

deger_vektoru: ["P", "Z", "R"]
uc_rol:
  - rol: "E-ticaret işletmecisi"
    is_bitince: "Ürün bazlı ZAM YAP / TUT / İNDİRİMİ KES kararını uygular"
  - rol: "Mali işler"
    is_bitince: "Net kâr, katkı payı ve başabaş fiyatı deftere işler"
  - rol: "SMMM / danışman"
    is_bitince: "Fiyatlama kanıt raporunu dosyalar"

