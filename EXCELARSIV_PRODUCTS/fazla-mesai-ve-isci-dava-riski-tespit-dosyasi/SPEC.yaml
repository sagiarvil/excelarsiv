urun:
  slug: fazla-mesai-ve-isci-dava-riski-tespit-dosyasi
  ad: "Fazla Mesai ve İşçi Dava Riski Tespit Dosyası"
  karar: "Çalışan bazında fazla mesai ücretini, yıllık 270 saat sınırını ve kayıt eksikliğini denetler; fazla mesai ve dava riski tutarını hesaplar ve UYGUN / İNCELE / DURDUR kararı üretir"
  hedef_kullanici: "İşverenler, İK yöneticileri, mali müşavirler, avukatlar ve çalışma mevzuatına uyum izleme yapan profesyoneller"
  mevzuat:
    - "4857 s. İş Kanunu md.41: fazla çalışma ücreti (saat ücreti + %50); yıllık fazla çalışma üst sınırı 270 saat"
    - "4857 s. İş Kanunu md.42: fazla sürelerle çalışma ücreti (saat ücreti + %25)"
    - "4857 s. İş Kanunu md.43: tatil günlerinde çalışma ücreti"
    - "4857 s. İş Kanunu md.32/8: işçi ücret ve fazla mesai alacaklarında 5 yıllık zamanaşımı süresi"
  giris:
    calisanlar:
      tablo: tblCalisan
      kolonlar: [Çalışan Adı, İşe Giriş Tarihi, Aylık Brüt Ücret, Aylık Fazla Mesai Saati, Haftalık Çalışma Saati]
    kayitlar:
      tablo: tblKayit
      kolonlar: [Çalışan Adı, Dönem, Bildirilen Mesai Saati, Belgelenen Mesai Saati]
  esikler:
    yillik_mesai_sinir: 270
    mesai_katsayi: 1.5
    fazla_sure_katsayi: 1.25
    zaman_asimi_yil: 5
    dava_riski_esik: 0.50
    kayit_farki_esik: 0.20
    anomali_z_esik: 2.00
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, fazla mesai yükü, dava riski tutarı ve aksiyon önerileri"

