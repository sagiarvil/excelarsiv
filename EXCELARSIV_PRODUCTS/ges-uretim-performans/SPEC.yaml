  kaynak: "GES performans izleme danışmanlığı + PR/kayıp analizi komuta dosyası"

deger_vektoru: ["P", "Z", "R"]
uc_rol:
  - rol: "Saha enerji operatörü"
    is_bitince: "Günlük üretim-ışınım-kayıp satırını ≤6 alanda kilitler"
  - rol: "GES işletme müdürü"
    is_bitince: "PR oranı, kayıp kırılımı ve UYGUN/DİKKAT/KRİTİK/VERİ YOK kararını görür"
  - rol: "CFO / varlık yöneticisi"
    is_bitince: "RAPOR ile dönemsel üretim-performans kanıtını dosyalar"

lansman_tetigi:
  sinif: Sezon
  aciklama: "Yaz üretim sezonu ve kış düşük PR denetimi — sezonsal performans kapanışı"
  tarih_penceresi: "sezon_basi_eksi_45_gun"

rakip_ayrim:
  - sinif: R1_jenerik
    ayrim: "PR oranı = üretim / (ışınım × kapasite) tek formül; sabit skor yok"
    karsilik: "gup_prOrani"
  - sinif: R1_jenerik
    ayrim: "Kayıp kırılımı (kirlenme/gölge/inverter/arıza) alarm kuyruğu"
    karsilik: "gup_kayipKirilim"
  - sinif: R1_jenerik
    ayrim: "Varlık sağlık skoru PR ve alarmdan formülle türer"
    karsilik: "gup_saglikSkor"
  - sinif: R2_bedava
    ayrim: "12 aylık sezonsal üretim-PR zinciri"
    karsilik: "gup_sezonsalTrend"
  - sinif: R4_yazilim
    ayrim: "Makrosuz, çevrimdışı; SCADA API bağı yok"
    karsilik: "gup_kararKapi"

serbest_alternatif:
  soru: "Alıcı bunu bedavaya nasıl yapar?"
  adaylar:
    - "İnverter CSV + ışınım ölçer verisini ayrı Excel'de birleştirmek"
    - "PR oranını hesap makinesiyle elle bölmek"
    - "SCADA / EMS aboneliği"
  ayrimlar:
    - madde: "PR + kayıp kırılımı tek satırda canlı formül"
      karsilik: "gup_prOrani"
    - madde: "Varlık sağlık skoru COUNTIF/SUMIF ile veriden türer"
      karsilik: "gup_saglikSkor"
    - madde: "Alarm eşiği AYARLAR + varlık/eşik/süre listesi"
      karsilik: "gup_alarmListesi"
    - madde: "12 ay sezonsal üretim-PR karşılaştırması"
      karsilik: "gup_sezonsalTrend"
    - madde: "Boş dosyada VERİ YOK; UYGUN/DİKKAT/KRİTİK kapısı"
      karsilik: "gup_kararKapi"

saha:
  gunluk_giris_alan: 6
  birim_disiplini: true
  sezonsallik_ay: 12
  saglik_skor_formul: true
  alarm_esik_ayarlar: true

analitik_moduller:
