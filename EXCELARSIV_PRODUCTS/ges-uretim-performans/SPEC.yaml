  - {kod: T2, ad: "Aylık üretim trend", ad_tanimi: "gup_aylikUretimTrend", yorum_hucresi: "gup_yorumAylik"}
  - {kod: O1, ad: "PR sapma", ad_tanimi: "gup_prSapma", yorum_hucresi: "gup_yorumSapma"}
  - {kod: O2, ad: "Duyarlılık tornado", ad_tanimi: "gup_tornadoZirve", yorum_hucresi: "gup_yorumTornado"}
  - {kod: O3, ad: "Senaryo", ad_tanimi: "gup_senaryoKarsilastirma", yorum_hucresi: "gup_yorumSenaryo"}
  - {kod: O6, ad: "Yoğunlaşma HHI", ad_tanimi: "gup_hhi", yorum_hucresi: "gup_yorumHhi"}
  - {kod: O8, ad: "Kalite skoru", ad_tanimi: "gup_kaliteSkor", yorum_hucresi: "gup_yorumKalite"}
  - {kod: M_SEN, ad: "Senaryo motoru", ad_tanimi: "gup_senaryoMotor", yorum_hucresi: "gup_yorumSenMotor"}
  - {kod: I1, ad: "Tahmin aralık", ad_tanimi: "gup_tahminAralik", yorum_hucresi: "gup_yorumTahmin"}
  - {kod: I2, ad: "Yüzdelik P90", ad_tanimi: "gup_yuzdelikP90", yorum_hucresi: "gup_yorumP90"}

