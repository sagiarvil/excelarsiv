urun:
  slug: gunluk-gelir-gider-karlilik-sistemi
  ad: "Günlük Gelir-Gider ve Gerçek Kârlılık Sistemi"
  karar: "Tahakkuk ve nakit bazlı gelir-gideri günlük kaydeder; brüt/faaliyet marjı, başabaş cirosu, kârın nakde dönüşümü ve senaryo bandını hesaplar; eşik dışı marj, ortak çekişi ve finansman yükünde RİSKLİ/DİKKAT kararı üretir; veri yetersizse VERİ YOK der"
  hedef_kullanici: "Kobi sahipleri, finans yöneticileri, muhasebe sorumluları, operasyon yöneticileri"
  mevzuat:
    - "Türk Ticaret Kanunu (6102 s.): gerçeğe uygun ve dönemsel kayıt ilkeleri"
    - "Vergi Usul Kanunu (213 s.): kayıt düzeni, defter ve belge nizamı"
    - "Türkiye Muhasebe Standartları kapsamında tahakkuk esası ve dönem ayrımı"
  giris:
    hesap_plani:
      tablo: tblHesap
      kolonlar: ["Hesap Kodu", "Hesap Adı", "Tür", "Alt Hesap", "Varsayılan Sınıf", "Sıra No", "Açıklama", "Veri Durumu"]
    gelir_gider:
      tablo: tblGelirGider
      kolonlar: ["Kayıt ID", "Tarih", "Belge No", "İşlem Türü", "Ana Sınıf", "Kategori", "Alt Kategori", "Cari", "Ürün/Hizmet", "Proje", "Açıklama", "Miktar", "Birim", "Birim Fiyat", "Tutar", "KDV İşareti", "Tahakkuk Tarihi", "Nakit Tarihi", "Nakit Gerçekleşti mi?", "Sabit/Değişken", "Doğrudan/Dolaylı", "Tekrarlayan/Tek Seferlik", "Ortak İşlemi", "Finansman İşlemi", "Yatırım İşlemi"]
    satis_maliyet:
      tablo: tblSatis
      kolonlar: ["Ürün/Hizmet", "Kategori", "Satış Adedi", "Birim Fiyat", "Satış Tutarı", "Birim Maliyet", "Maliyet Tutarı", "Brüt Kâr", "Brüt Marj"]
  esikler:
    asgari_veri_sayisi: 6
    esik_izle: 49
    esik_kritik: 70
  rapor: "A4, PDF'e hazır; genel karar, KPI özeti, varsayımlar ve önerilen aksiyonlar"

