    - "Kârlılığın yalnızca dönem sonu gelir-gider farkıyla ölçülmesi (marj ve başabaş analizi yok)"
    - "Muhasebeciden aylık mali tablo beklentisi (günlük karar alınamaz, gecikmeli tespit)"
