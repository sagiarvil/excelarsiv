    - madde: "Başabaş cirosunu hesaplayarak hangi satış seviyesinde zarar edileceğini gösterir"
      karsilik: BasabasCiro
    - madde: "Nakdi gerçekleşmemiş satışı yaşlandırarak tahsilat riskini görünür kılar"
      karsilik: modulT1Yaslandirma
    - madde: "Aylık trend ve dönem karşılaştırmasıyla bozulmayı erken yakalar"
      karsilik: modulT2Trend
    - madde: "Satış hacmi ±%15 senaryosunda kâr bandını göstererek karar aralığı sunar"
