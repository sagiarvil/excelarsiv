urun:
  slug: hakedis-fiyat-farki-hak-kaybi-cetveli
  ad: "Hakediş Fiyat Farkı ve Hak Kaybı Cetveli"
  karar: "Sözleşmeli işlerde fiyat farkı katsayısını hesaplamak, sözleşme fiyatları ile piyasa arasındaki farktan doğan hak kaybını ölçmek ve hak kaybının telafisi için aksiyon üretmek"
  hedef_kullanici: "Yapım işleri ve mal alımlarında hakediş düzenleyen yükleniciler, müteahhitler ve sözleşme yöneticileri"
  mevzuat:
    - "4734/4735 sayılı Kamu İhale Kanunu: sözleşmelerde fiyat farkı uygulaması"
    - "Türk Borçlar Kanunu md.480: aşırı ifa güçlüğü ve işin yapılması"
    - "Hazine ve Maliye Bakanlığı tebliğleri: fiyat farkı katsayı formülleri (işçilik, malzeme, makine ve ekipman bileşenleri)"
  giris:
    sozlesme_karti:
      alanlar: [sozlesmeAdi, yuklenici, isveren, sozlesmeTarihi, ihaleTarihi, sozlesmeBedeli, isSuresi, paraBirimi]
    hakedis_kalemleri:
      tablo: tblHakedis
      kolonlar: [kalemAdi, birim, miktar, sozlesmeBirimFiyat, piyasaBirimFiyat]
    endeks_kayitlari:
      tablo: tblEndeks
      kolonlar: [donem, iscilikEndeks, malzemeEndeks, makineEndeks]
    hakedis_donemleri:
      tablo: tblDonemler
      kolonlar: [donemNo, donemTarihi, hakedisTutari, gecOdemeGun]
  esikler:
    kayip_dikkat_oran: 0.05      # sözleşme bedeline göre kayıp oranı > %5 → DİKKAT
    kayip_kritik_oran: 0.15      # kayıp oranı > %15 → KRİTİK (hak kaybı telafi gerekir)
    fiyat_farki_esik: 0.03       # fiyat farkı katsayısı > %3 → artış lehte
    mutabakat_tolerans: 100      # hakediş/mutabakat farkı kabul toleransı (₺)
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, fiyat farkı katsayısı, hak kaybı tutarı ve telafi aksiyonları"

