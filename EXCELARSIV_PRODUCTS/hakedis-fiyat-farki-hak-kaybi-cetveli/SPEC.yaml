      karsilik: HakKaybiToplam
    - madde: "Hakediş dönemlerinde geç ödeme gününü ve hak kaybını otomatik hesaplar; eşik üstü gecikmeyi işaretler"
      karsilik: modulO4NakitGunu
    - madde: "Endeks hareketlerini Z skoruyla denetler; uç hareketi TÜİK ile mutabakat gerekliliği olarak raporlar"
      karsilik: modulO1AnomaliSayisi
    - madde: "Tornado duyarlılıkla fiyat farkı katsayısını en çok etkileyen değişkeni sıralar"
      karsilik: modulO2TornadoZirve
    - madde: "Senaryo motoru ile kötümser/baz/iyimser fiyat farkı ve kararı tek ekranda üretir"
      karsilik: modulO3SenaryoBaz
    - madde: "Endeks trendinden sonraki dönem projeksiyonu ve tahmin bandını üretir; sonuç ad tanımlı ve raporlanabilir"
      karsilik: modulI1TahminOrta
