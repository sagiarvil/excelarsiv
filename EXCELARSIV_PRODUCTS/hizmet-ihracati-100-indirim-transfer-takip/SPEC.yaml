  motor_sayfasi: "MOTOR"
  pano_sayfasi: "PANO"
  ayarlar_sayfasi: "AYARLAR"
  modul_puanlari: {"T": 10, "O": 15, "I": 25, "M": 25}

ornek_veri: ornek_veri.csv
onay: {durum: ONAYLANDI, not: "FAZ 2 — Hat A #4 A1+A2"}
