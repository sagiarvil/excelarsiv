serbest_alternatif:
  alternatifler:
    - "İdarelerin açık yayımladığı sınır değer hesaplama cetvelleri ve hesap tabloları"
    - "İhale mevzuat danışmanının teklif başı danışmanlık ücreti"
    - "Ücretsiz Excel şablonları"
    - "Genel amaçlı yapay zekâ ile elle kurulum"
  ayrimlar:
    - madde: "Sınır değeri N katsayısı ve hesap yöntemi seçimiyle otomatik hesaplar; yöntem değişiminde cetveli elle yeniden kurmayı gerektirmez"
      karsilik: SinirDeger
    - madde: "Öneri teklifi hedef kâr marjına göre TL ve sınır değer oranı bazında üretir; risk bölgesine düşüp düşmediğini otomatik işaretler"
      karsilik: OneriTeklif
    - madde: "Rakip teklif anomalilerini Z skoruyla tespit eder; geçersiz teklifleri ortalama ve sınır değer hesabından ayırır"
      karsilik: modulO1AnomaliSayisi
    - madde: "Maliyet kalemleri ile toplam maliyet mutabakatını tolerans içinde denetler; sapmayı TL ve oran bazında gösterir"
      karsilik: MutabakatFark
    - madde: "Geçmiş ihalelerden kazanma oranı ve sınır değer iskontosunu tahmin eder; tahmin alt/üst bandı üretir"
      karsilik: modulI1TahminOrta
    - madde: "Tornado duyarlılıkla hangi değişkenin sınır değeri ve öneriyi en çok etkilediğini sıralar"
      karsilik: modulO2TornadoZirve

