arketip: A1
urun:
  slug: ihaleye-kac-tl-teklif-vermeliyim
  ad: "İhaleye Kaç TL Teklif Vermeliyim? (Sınır Değer Hesaplayıcı)"
  karar: "Teklif öncesinde sınır değeri hesaplamak; güvenli teklif bölgesini, beklenen kâr marjını ve riski ortaya koymak; UYGUN / İNCELE / DURDUR kararı üretmek"
  hedef_kullanici: "Yapım işi ve mal alımı ihalelerine teklif hazırlayan müteahhit, yüklenici ve firmalar"
  mevzuat:
    - "4734 sayılı Kamu İhale Kanunu: teklif değerlendirme ve sınır değer uygulaması"
    - "Yapım İşleri İhaleleri Uygulama Yönetmeliği md.61-62: sınır değer hesabı ve sınır değer katsayısı (N)"
  giris:
    ihale_karti:
      alanlar: [ihaleAdi, idare, ihaleTarihi, yaklasikMaliyet, nKatsayisi, hedefKarMarji, toplamMaliyet, isKalemSayisi, fiyatFarkiMaddeVarMi]
    rakip_teklifler:
      tablo: tblRakipler
      kolonlar: [rakipAdi, teklifTutari, gecerliMi]
    onceki_ihaleler:
      tablo: tblGecmis
      kolonlar: [ihaleAdi, tarih, yaklasikMaliyet, sinirDeger, bizimTeklif, kazananTeklif]
    maliyet_kalemleri:
      tablo: tblMaliyet
      kolonlar: [kalemAdi, birim, miktar, birimMaliyet]
  esikler:
    guvenlik_payi: 0.03           # sınır değerin üzerine eklenen güvenlik payı
    sd_asiri_dusuk_esik: 1.00     # teklif/SD oranı < 1,00 → aşırı düşük riski
    anomali_z_esigi: 2.00         # rakip tekliflerde |Z| eşiği
    mutabakat_tolerans: 10000     # maliyet mutabakatı kabul toleransı (₺)
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, sınır değer karşılaştırması, maliyet mutabakatı ve risk çekinceleri"

