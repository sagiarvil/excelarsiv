  Y2_kurulum_ikamesi_tl: 2500

serbest_alternatif:
  alternatifler:
    - "Depo teslim birim maliyeti elle FOB/kur/vergi matrahı zinciriyle hesap tablosunda hesaplamak"
    - "Dış ticaret danışmanının her sevkiyat için ithalat maliyeti raporlama bedeli"
    - "Ücretsiz Excel şablonları ve genel amaçlı takip araçları"
    - "Gümrük müşavirinin her ürün için ayrı hesap üretmesi"
    - "Maliyeti yuvarlayıp (FOB×kur×1.3 gibi) kaba paylarla stok maliyetine işlemek"
  ayrimlar:
    - madde: "FOB kıymetten depo teslim maliyete giden adım zincirini (FOB→navlun→CIF→GV→ÖTV→KDV→masraf) ürün satırında tek formülle üretir"
      karsilik: ToplamDepoTeslimMaliyeti
    - madde: "Yurt içi operasyon masraflarını ürünlerin FOB payıyla orantılı dağıtır; masraf tablosu ayrıdır"
      karsilik: ToplamYurtIciMasraf
    - madde: "Bileşik vergi yükünü (GV+ÖTV+KDV matrah zinciri) ürün bazında raporlar"
      karsilik: modulT6VergiYukOran
    - madde: "Kötümser/baz/iyimser kur ve oran senaryolarında depo teslim maliyeti ve karar değişimini üretir"
      karsilik: modulO3SenaryoFark
    - madde: "Tornado duyarlılıkla depo teslim maliyeti en çok etkileyen değişkeni sıralar"
      karsilik: modulO2TornadoZirve
    - madde: "Hesaplanan toplam maliyet ile beyan/giriş toplamları arasındaki mutabakat farkını denetler"
      karsilik: modulT5MutabakatFark
    - madde: "Birim maliyet tahmini, P90 aralığı ve NPV değerini üretir; sonuç ad tanımlı ve raporlanabilir"
      karsilik: modulI1MaliyetTahmin
    - madde: "Peşin ödenen ithal vergilerinin nakit açığı köprüsünü üretir; sonuç ad tanımlıdır"
      karsilik: modulI7NakitAcik

anahtar_stratejisi:
