olcek_hedefi: 50000
arketip: A2
denetim:
  giris_dolgu: ["FFFFF2CC"]
  koruma_sifresi: "1234"
  asgari_grafik: 6
  sonda_olacak_sayfalar: ["KILAVUZ", "AYARLAR", "LISTELER"]
  asgari_derinlik_puani: 100
  asgari_ayrim_maddesi: 5
  modul_puanlari:
    T: 10
    O: 15
    I: 25

testler:
  olcek:
    satir: 1200

urun:
  slug: ithalat-depo-teslim-rafa-gelen-net-birim-maliyet
  ad: "İthalat Depo Teslim (Rafa Gelen) Net Birim Maliyet"
  karar: "İthal edilen ürünün depo teslim (rafa gelen) net birim maliyetini FOB kıymet, navlun/sigorta, gümrük vergisi, ÖTV ve KDV matrah zinciriyle hesaplar; yurt içi operasyon masraflarını ürünlere dağıtır ve UYGUN / İNCELE / DURDUR kararı verir"
  hedef_kullanici: "İthalatçı firmalar, dış ticaret sorumluları, mali müşavirler, depo ve satın alma yöneticileri, stok maliyeti doğrulayan KOBİ sahipleri"
  mevzuat:
    - "4458 s. Gümrük Kanunu: gümrük kıymeti (FOB/CIF), beyan, gümrük vergisi tahakkuku"
    - "3065 s. KDV Kanunu md.21: ithalatta KDV matrahı = CIF + gümrük vergisi + ÖTV + İGV + KKDF"
    - "4760 s. ÖTV Kanunu: ithalatta ÖTV matrahı = CIF + gümrük vergisi (özel tüketim vergisi listesi)"
    - "İthalat Rejimi Kararı: gümrük vergisi oranları; sigorta götürü bedeli uygulaması"
  giris:
    urunler:
      tablo: tblUrun
      kolonlar: [Ürün Adı, Birim, Adet, FOB Birim Fiyat, Döviz Cinsi, Kur, Navlun/Sigorta Oranı, Gümrük Vergisi Oranı, ÖTV Oranı, KDV Oranı]
    masraflar:
      tablo: tblMasraf
      kolonlar: [Masraf Kalemi, Tutar, Döviz Cinsi]
  esikler:
    vergi_yuk_esik: 0.25
    anomali_z_esik: 2.00
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
    mutabakat_esik_oran: 0.05
    senaryo_etki_esik: 0.15
  rapor: "A4, PDF'e hazır; yönetici özeti, depo teslim birim maliyet, vergi yükü ve aksiyonlar"

