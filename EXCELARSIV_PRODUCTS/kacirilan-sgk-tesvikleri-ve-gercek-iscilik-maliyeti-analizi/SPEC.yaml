urun:
  slug: kacirilan-sgk-tesvikleri-ve-gercek-iscilik-maliyeti-analizi
  ad: "Kaçırılan SGK Teşvikleri & Gerçek İşçilik Maliyeti Analizi"
  karar: "Brüt ücret üzerinden işveren SGK payı, işsizlik payı, kıdem karşılığı ve yan faydalarla gerçek işçilik maliyetini hesaplamak; işletmenin yararlanmadığı SGK teşviklerini parayla ölçüp teşvik kullanım oranını ve kararı (UYGUN/İNCELE/DURDUR) üretmek"
  hedef_kullanici: "İşverenler, İK ve maliyet yöneticileri, muhasebe ve SGK işlemlerini yürüten profesyoneller"
  mevzuat:
    - "5510 sayılı Kanun md.81: 5 puanlık prim indirimi (işveren payı)"
    - "4447 sayılı Kanun geçici 10. madde: kadın, genç ve mesleki belgeli istihdam teşviki"
    - "İlave istihdam teşviki ve engelli çalıştırma teşviki uygulamaları"
  giris:
    calisan_karti:
      alanlar: [FirmaUnvani, SgkSicilNo, ToplamPrimGunu, OrtalamaCalisan]
      tablo: tblCalisan
      kolonlar: [Çalışan Adı, Brüt Ücret, Prim Günü, Yaş, Cinsiyet]
    gercek_maliyet:
      tablo: tblMaliyet
      kolonlar: [Çalışan Adı, Brüt Ücret, SGK İşveren Payı]
    tesvik_simulator:
      tablo: tblTesvik
      kolonlar: [Çalışan Adı, Teşvik Türü, Kaçırılan]
  esikler:
    kacirilan_tesvik_esik: 50000   # kaçırılan teşvik uyarı eşiği (₺/yıl)
    maliyet_esik: 40000            # çalışan başı aylık maliyet eşiği (₺)
    kullanim_oran_esik: 0.15       # teşvik kullanım oranı alt eşiği
    yuk_oran_alt: 0.1              # işveren yükü makul alt sınırı
    yuk_oran_ust: 0.5              # işveren yükü makul üst sınırı
    yuk_tutarlilik_tolerans: 0.02  # maliyet/brüt tutarlılık toleransı
    yuk_oran_karar: 0.3            # işveren yükü karar eşiği
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, gerçek işçilik maliyeti, kaçırılan teşvik tutarı, teşvik kullanım oranı, kalite skoru ve aksiyon önerileri"

