    ayrim: "Tek seferlik alım, aylık abonelik yok"
    karsilik: "kdo_fiyatModeli"
  - sinif: R3_saas
    ayrim: "Veri cihazdan çıkmaz"
    karsilik: "kdo_kvkkBeyani"
  - sinif: R1_jenerik
    ayrim: "Hacimsel desi + faturalanan birim tek motorda"
    karsilik: "kdo_faturalananBirim"
  - sinif: R1_jenerik
    ayrim: "Sipariş↔tarife eşleştirme ile gerçek kargo maliyeti"
    karsilik: "kdo_eslesmeOrani"
  - sinif: R1_jenerik
    ayrim: "KDO kök neden + TANIMSIZ kova"
    karsilik: "kdo_tanimsizKova"

serbest_alternatif:
