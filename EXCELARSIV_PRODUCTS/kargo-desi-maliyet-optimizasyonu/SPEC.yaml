    - "Elle desi hesap makinesi + tarife PDF"
    - "Taşıyıcı panosu + hesap makinesi"
    - "Muhasebecinin dönem kargo özeti"
  ayrimlar:
    - madde: "Sipariş no normalize + duplike denetimli eşleştirme"
      karsilik: "kdo_normAnahtar"
    - madde: "Dört kova bütünlüğü (hedef↔faturalanan maliyet)"
      karsilik: "kdo_kovaButunluk"
    - madde: "TANIMSIZ kök-neden kovası görünür"
      karsilik: "kdo_tanimsizKova"
    - madde: "Eşleşme oranı veriden türer"
      karsilik: "kdo_eslesmeOrani"
    - madde: "50.000 satır ölçek sözleşmesi"
      karsilik: "kdo_olcekHedef"

