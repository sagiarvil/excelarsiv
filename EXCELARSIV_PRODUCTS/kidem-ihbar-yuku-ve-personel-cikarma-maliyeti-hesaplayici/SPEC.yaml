urun:
  slug: kidem-ihbar-yuku-ve-personel-cikarma-maliyeti-hesaplayici
  ad: "Kıdem–İhbar Yükü ve Personel Çıkarma Maliyeti Hesaplayıcı"
  karar: "Çalışanın kıdem süresine göre kıdem tazminatı, ihbar tazminatı ve kullanılmamış yıllık izin ücretini hesaplar; toplam çıkarma maliyetini bütçeyle karşılaştırır ve UYGUN / İNCELE / DURDUR kararı üretir"
  hedef_kullanici: "İnsan kaynakları yöneticileri, işverenler, mali müşavirler ve personel çıkarma planı yapan işletme sahipleri"
  mevzuat:
    - "1475 s. İş Kanunu md.14: kıdem tazminatı (her tam yıl için 30 günlük brüt ücret; tavan uygulaması)"
    - "4857 s. İş Kanunu md.17: bildirim süreleri ve ihbar tazminatı (2/4/6/8 hafta)"
    - "4857 s. İş Kanunu md.53: yıllık ücretli izin hakları (14/20/26 gün)"
    - "SGK 5510 s. Kanun md.80-81: işveren prim yükleri ve bildirim yükümlülükleri"
  giris:
    calisanlar:
      tablo: tblCalisan
      kolonlar: [Çalışan Adı, İşe Giriş Tarihi, İşten Çıkış Tarihi, Brüt Ücret, Ücret Türü]
  esikler:
    cikarma_butce_esik: 500000
    kidem_yil_esik: 10
    ucret_anomali_z_esik: 2.00
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, kıdem/ihbar/izin yükü, bütçe kullanımı ve aksiyon önerileri"

