    - madde: "Aylık risk skoru üretir; asgari ve hedef eşiğin altındaki kapanışları önceden işaretler"
      karsilik: KobiRiskSkoru
    - madde: "İyimser/baz/kötümser senaryoda kapanış ve risk bandını gösterir"
      karsilik: KobiIyiSenaryo
    - madde: "Tahsilat ve gider değişkeninin kapanışa etkisini tornado ile önceliklendirir"
      karsilik: KobiTornadoTahsilat
    - madde: "FORECAST ile gelecek ay nakit tahmini üretir; veri kalitesi düşükse karar VERİ YOK kalır"
      karsilik: KobiTahminiKar

