serbest_alternatif:
  alternatifler:
    - "Gelir ve giderlerin ayrı Excel listelerinde elle tutulması; kapanış nakdinin manuel toplamla bulunması"
    - "Bankanın internet şubesi dökümüyle nakit takibi (kasa, cari ve POS tahsilatı görünmez)"
    - "Dönem sonunda mali müşavirden mali tablo beklemek (aylık karar alınamaz)"
    - "Nakit akışını yalnızca giriş-çıkış farkıyla izlemek (risk skoru, senaryo ve tahmin yok)"
    - "Aylık bütçe tablosunu her ay sıfırdan yeniden kurmak (birikimli karşılaştırma ve değişim takibi yok)"
  ayrimlar:
    - madde: "Dört tahsilat kanalını (kasa, banka, cari, POS) tek modelde birleştirir ve kapanış nakdini otomatik üretir"
