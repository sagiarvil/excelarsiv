    ayrim: "Geçersiz durum geçişi görünür uyarı"
    karsilik: "mbk_gecersizGecis"
  - sinif: R2_bedava
    ayrim: "MBK-001..005 kural tablosu 2025-2027 yan yana"
    karsilik: "mbk_kuralYilMatris"
