      karsilik: "mbk_durumHaritasi"
    - madde: "Geçersiz geçiş görünür uyarı"
      karsilik: "mbk_gecersizGecis"
    - madde: "Plan ↔ gerçekleşen ↔ duruş zincir bayrağı"
