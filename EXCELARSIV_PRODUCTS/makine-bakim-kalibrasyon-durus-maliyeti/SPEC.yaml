    - {durum_id: YAPILDI, durum_adi: Yapıldı, sira: 2, izinli_sonraki_durumlar: "", kategori: kapali}
    - {durum_id: GECIKME, durum_adi: Gecikme, sira: 3, izinli_sonraki_durumlar: "YAPILDI|KRITIK", kategori: acik}
    - {durum_id: KRITIK, durum_adi: Kritik, sira: 4, izinli_sonraki_durumlar: "YAPILDI", kategori: acik}
  zincir_halkalari: [plan_tarih, gerceklesen, durus_saat, kalibrasyon]
  kuyruk_tanimlari: [Plan, Gecikme, Kritik]

