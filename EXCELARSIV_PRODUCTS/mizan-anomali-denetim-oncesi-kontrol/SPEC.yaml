  ad: "Mizan Anomali & Denetim Öncesi Kontrol"
  surum: "1.0.0"
  satis_fiyati_tl: 9900
  hedef_kullanici: "SMMM, iç denetim, mali işler, denetim öncesi hazırlık"

arketip: A2
fiyat: 9900
olcek_hedefi: 50000

deger:
  satis_fiyati_tl: 9900
  Y1_danisman_ikamesi_tl: 20000
  Y2_kurulum_ikamesi_tl: 10000
  Y3_onlenen_hata_tl: 18000
  Y4_saas_yillik_ikamesi_tl: 8000
  kaynak: "Denetim öncesi mizan tarama danışmanlığı + hesap↔profil eşleştirme kurulumu"

deger_vektoru: ["P", "Z", "R"]
uc_rol:
  - rol: "Mali işler / muhasebe"
    is_bitince: "TEMİZ / İNCELE / KRİTİK kararını uygular"
  - rol: "İç denetim"
    is_bitince: "Anomali listesini saha kontrolüne alır"
  - rol: "SMMM / dış denetçi"
    is_bitince: "Denetim öncesi kanıt raporunu dosyalar"

lansman_tetigi:
  sinif: Donem
  aciklama: "Dönem sonu / denetim ziyareti öncesi −14 gün"
  tarih_penceresi: "denetim_oncesi_14_gun"

rakip_ayrim:
  - sinif: R3_saas
    ayrim: "Tek seferlik alım, aylık abonelik yok"
    karsilik: "mad_fiyatModeli"
  - sinif: R3_saas
    ayrim: "Veri cihazdan çıkmaz"
    karsilik: "mad_kvkkBeyani"
  - sinif: R1_jenerik
    ayrim: "Borç=alacak denge + sapma % + anomali skoru tek motorda"
    karsilik: "mad_anomaliMotoru"
  - sinif: R1_jenerik
    ayrim: "Mizan satırı↔beklenen profil eşleştirme"
    karsilik: "mad_eslesmeOrani"
  - sinif: R1_jenerik
    ayrim: "MAD kök neden + TANIMSIZ kova"
    karsilik: "mad_tanimsizKova"

serbest_alternatif:
  soru: "Alıcı bunu bedavaya nasıl yapar?"
  adaylar:
    - "Elle mizan Excel + filtre"
    - "ERP mizan dökümü + hesap makinesi"
    - "Muhasebecinin dönem sonu kontrol listesi"
  ayrimlar:
    - madde: "Hesap kodu normalize + duplike denetimli eşleştirme"
      karsilik: "mad_normAnahtar"
    - madde: "Dört kova bütünlüğü (mizan↔beklenen)"
      karsilik: "mad_kovaButunluk"
    - madde: "TANIMSIZ kök-neden kovası görünür"
      karsilik: "mad_tanimsizKova"
    - madde: "Eşleşme oranı veriden türer"
      karsilik: "mad_eslesmeOrani"
    - madde: "50.000 satır ölçek sözleşmesi"
      karsilik: "mad_olcekHedef"

anahtar_stratejisi:
  birincil: "UPPER(TRIM(SUBSTITUTE(hesap_kodu,\" \",\"\")))"
  ikincil: "LEFT(norm,8) veya hesap sınıfı"
  kisa_uzun_senaryo: true

mutabakat:
  tolerans_kurus: 0.05
  kova_kurallari: [eslesti, tolerans_icinde, tutar_farki, eslesmedi]

kurallar:
  - MAD-001
  - MAD-002
  - MAD-003
  - MAD-004
  - MAD-005

