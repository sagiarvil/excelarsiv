urun:
  slug: nakliye-maliyeti-hesaplayici
  ad: "Nakliye Maliyeti Hesaplayıcı"
  karar: "Araç filosu ve sefer kayıtları üzerinden yakıt, bakım, sürücü ve amortisman maliyetlerini sefer bazında hesaplayarak toplam nakliye maliyetini, km ve ton-km başına birim maliyeti ve net kârı bulur; kâr marjını eşiklerle karşılaştırarak KARLI/İNCELE/ZARARLI kararını gerekçesi ve önerilen aksiyonlarla üretir; hasılat yoğunlaşması, anomali, senaryo ve tornado analiziyle gelecek dönem maliyet tahminini üretir"
  moduller:
    - zaman_serisi_projeksiyon
    - duyarlilik_tornado
    - senaryo_motoru
    - yogunlasma_analizi
    - anomali_tespiti
    - kalite_skoru
    - karar_kapisi
    - aksiyon_uretici
    - yuzdelik_dilim
    - esik_kirilim
