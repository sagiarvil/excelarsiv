serbest_alternatif:
  alternatifler:
    - "Sefer maliyetini yakıt fişleri, bakım faturaları ve sürücü ücretlerini toplayarak hesap makinesiyle kalem kalem çıkarmak"
    - "Araç özelliklerini (tüketim, bakım, amortisman) ayrı Excel sayfalarında tutup sefer bazında manuel birleştirmek"
    - "Birim maliyeti (TL/km, ton-km) hiç hesaplamadan taşıma fiyatını sezgisel belirlemek"
    - "Her sefer için hasılat-maliyet farkını aylarca elle toplayıp yönetici raporu hazırlamak"
    - "Kârsız seferleri belirleyip iyileştirme aksiyonunu el yazısı notlarla yönetmek"
  ayrimlar:
    - madde: "Sefer mesafesi ve araç özelliklerinden yakıt, bakım, sürücü ve amortisman maliyetini tek tabloda canlı formülle üretir; alternatifte her kalem elle çarpılır."
      karsilik: NakliyeToplamMaliyet
    - madde: "Toplam maliyeti mesafe ve ton-km bazında birim maliyete dönüştürüp hasılatla karşılaştırarak net kâr ve kâr marjını otomatik hesaplar; alternatifte mutabakat elle yürütülür."
      karsilik: NakliyeBirimMaliyet
    - madde: "Kâr marjını eşiklerle karşılaştırarak KARLI/İNCELE/ZARARLI kararını gerekçesi ve önerilen aksiyonlarla üretir; alternatifte karar belgesi elle yazılır."
      karsilik: NakliyeKarar
    - madde: "Yakıt fiyatı senaryo bant aralığı ve maliyet bileşeni duyarlılık (tornado) analizi ile net kârın belirsizlik aralığını ve en etkili değişkeni gösterir; alternatifte duyarlılık analizi yoktur."
      karsilik: modulO3Senaryo
    - madde: "Hasılat yoğunlaşmasını (HHI), maliyet sapmasını ve veri kalite skorunu ölçerek karar kapısına güven katmanı ekler; alternatifte bu analizler yoktur."
      karsilik: modulO8KaliteSkor
