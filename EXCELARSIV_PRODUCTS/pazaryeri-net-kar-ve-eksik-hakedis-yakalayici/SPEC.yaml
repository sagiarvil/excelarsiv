urun:
  slug: pazaryeri-net-kar-ve-eksik-hakedis-yakalayici
  ad: "Pazaryeri Net Kâr & Eksik Hakediş Yakalayıcı"
  karar: "Pazaryerinde satılan kalemlerin komisyon, kargo, reklam, iade ve ek gider sonrası net kârını ve kâr marjını hesaplar; beklenen hakediş ile pazaryerinden gelen gerçek hakedişi karşılaştırarak eksik tahsilatı eşiklerle işaretler; pazaryeri bazlı satış/kâr özeti, yoğunlaşma, anomali, senaryo ve tornado analiziyle net kâr projeksiyonu ve GÜÇLÜ/NORMAL/İNCELE kararı üretir"
  moduller:
    - zaman_serisi_projeksiyon
    - duyarlilik_tornado
    - senaryo_motoru
    - yogunlasma_analizi
    - anomali_tespiti
    - kalite_skoru
    - karar_kapisi
    - aksiyon_uretici
    - deger_olcer
    - esik_kirilim
