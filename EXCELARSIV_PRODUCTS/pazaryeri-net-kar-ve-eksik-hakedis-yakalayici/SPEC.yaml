serbest_alternatif:
  alternatifler:
    - "Her kalemin net kârını muhasebe/rapor sisteminden veya hesap makinesiyle kalem kalem çıkarmak"
    - "Pazaryeri mutabakat raporu ile banka tahsilatını elle karşılaştırıp eksik hakedişi teker teker aramak"
    - "Komisyon, kargo, reklam, iade ve ek giderleri ayrı ayrı Excel sayfalarında tutup toplam kârı manuel birleştirmek"
    - "Satış fiyatı ve komisyon değişimlerinin kâra etkisini ölçmeden, sezgisel olarak pazaryeri/fiyat kararı almak"
    - "Her dönem için pazaryeri bazlı kâr ve hakediş özetini aylarca elle toplamak ve yönetici raporu hazırlamak"
  ayrimlar:
    - madde: "Kalem bazında satış, komisyon, kargo, reklam, iade ve ek gider sonrası net kâr ve kâr marjını tek tabloda canlı formülle üretir; alternatifte her kalem elle hesap makinesiyle çıkarılır."
      karsilik: PazaryeriToplamNetKar
    - madde: "Beklenen hakediş ile gerçek hakedişi eşiklerle karşılaştırır, eksik tahsilatı kalem bazında işaretler ve toplam farkı üretir; alternatifte mutabakat elle yürütülür."
      karsilik: PazaryeriToplamFark
    - madde: "Pazaryeri bazlı satış, kâr, marj ve hakediş farkı özetini otomatik üretir, en iyi pazaryerini gerekçeli seçer; alternatifte bu özet haftalarca elle toplanır."
      karsilik: PazaryeriEnIyiPazaryeri
    - madde: "Satış fiyatı senaryoları ve komisyon tornado analizi ile net kâr bant aralığını ve en etkili değişkeni gösterir; alternatifte duyarlılık analizi yoktur."
      karsilik: modulO3Senaryo
    - madde: "Pazaryeri yoğunlaşmasını (HHI), net kâr sapmasını ve veri kalite skorunu ölçerek karar kapısına güven katmanı ekler; alternatifte bu analizler yoktur."
      karsilik: modulO8KaliteSkor

