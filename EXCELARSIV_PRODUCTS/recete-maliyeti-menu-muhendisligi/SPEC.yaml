  - {kod: O2, ad: "Duyarlılık tornado", ad_tanimi: "rmm_modulO2", yorum_hucresi: "rmm_modulO2Yorum"}
  - {kod: O3, ad: "Senaryo motoru", ad_tanimi: "rmm_modulO3", yorum_hucresi: "rmm_modulO3Yorum"}
  - {kod: O6, ad: "Hammadde yoğunlaşması", ad_tanimi: "rmm_modulO6", yorum_hucresi: "rmm_modulO6Yorum"}
  - {kod: O8, ad: "Veri kalite skoru", ad_tanimi: "rmm_modulO8", yorum_hucresi: "rmm_modulO8Yorum"}
  - {kod: I1, ad: "Tahmin aralık", ad_tanimi: "rmm_modulI1", yorum_hucresi: "rmm_modulI1Yorum"}
  - {kod: I2, ad: "Yüzdelik P90", ad_tanimi: "rmm_modulI2", yorum_hucresi: "rmm_modulI2Yorum"}

