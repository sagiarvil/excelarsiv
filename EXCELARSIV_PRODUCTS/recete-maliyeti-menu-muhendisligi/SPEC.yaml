uc_rol:
  - rol: "Mutfak şefi / reçete sorumlusu"
    is_bitince: "Menü kalemi bileşimini ve fire'li hammaddeleri kilitler"
  - rol: "Restoran sahibi"
    is_bitince: "Maliyet × popülerlik matrisi ve fiyat önerisini görür"
  - rol: "CFO / denetçi"
    is_bitince: "RAPOR ile reçete maliyet kırılımı ve varyans kanıtını dosyalar"

lansman_tetigi:
  sinif: Parametre_degisimi
  aciklama: "Gıda enflasyonu sonrası menü fiyat ve reçete maliyet revizyonu"
  tarih_penceresi: "gida_enflasyonu_sonrasi_30_gun"

recete:
  versiyonlama: true
  bilesim_yuzde_100: true
  fire_kolonu: true
  birim_donusum: true
  maliyet_kirilim: ["hammadde", "iscilik", "ambalaj", "genel_gider"]

rakip_ayrim:
  - sinif: R1_jenerik
    ayrim: "Maliyet × popülerlik matrisi + menü sınıfı (Yıldız/Yük/Bulmaca/Köpek)"
    karsilik: "rmm_menuSinif"
  - sinif: R1_jenerik
    ayrim: "Fire kolonlu reçete maliyeti; fire'siz hesap yasak"
    karsilik: "rmm_fireDahilMaliyet"
  - sinif: R2_bedava
    ayrim: "Reçete versiyon varyans köprüsü (fiyat/miktar/karışım)"
    karsilik: "rmm_varyansKopru"
  - sinif: R2_bedava
    ayrim: "Birim dönüşüm AYARLAR tablosundan; gömülü katsayı yok"
    karsilik: "rmm_donusumTablo"
  - sinif: R4_yazilim
    ayrim: "Makrosuz; boş dosyada VERİ YOK karar kapısı"
    karsilik: "rmm_kararKapi"

serbest_alternatif:
  soru: "Alıcı bunu bedavaya nasıl yapar?"
  adaylar:
    - "Malzeme fiyatlarını deftere yazıp porsiyonu hesap makinesiyle oranlamak"
    - "Şefin tek seferlik Excel'ini elle güncellemek"
    - "Restoran yazılımı aboneliği"
  ayrimlar:
    - madde: "Reçete bileşiminden porsiyon maliyeti ve fiyat önerisi canlı formül"
      karsilik: "rmm_porsiyonMaliyeti"
    - madde: "Bileşim %100 alarmı PANO'da; sessiz sapma yok"
      karsilik: "rmm_bilesimAlarm"
    - madde: "Fire kolonu + AYARLAR birim dönüşüm tablosu"
      karsilik: "rmm_donusumTablo"
    - madde: "Hammadde/işçilik/ambalaj/genel gider kırılımı = birim maliyet"
      karsilik: "rmm_kirilimKontrol"
    - madde: "Boş dosyada VERİ YOK; UYGUN/DİKKAT/KRİTİK kapısı"
      karsilik: "rmm_kararKapi"

