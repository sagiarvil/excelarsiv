  dosya: ReceteMaliyetiMenuMuhendisligi.xlsx
  prefix: rmm_
  satis_fiyati_tl: 9900
  hedef_kullanici: "Restoran sahibi, mutfak şefi, maliyet kontrolörü, CFO"

arketip: A7
fiyat: 9900
olcek_hedefi: 10000

deger:
  satis_fiyati_tl: 9900
  Y1_danisman_ikamesi_tl: 24000
  Y2_kurulum_ikamesi_tl: 12000
  Y3_onlenen_hata_tl: 52000
  Y4_saas_yillik_ikamesi_tl: 0
  kaynak: "Menü mühendisliği danışmanlığı + reçete maliyet komuta dosyası"

