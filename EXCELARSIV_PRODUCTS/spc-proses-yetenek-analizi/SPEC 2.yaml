# =============================================================================
# SPEC — Hat B Y-20 · SPC Proses Yetenek Analizi
# Durum: ONAYLANDI — Hat B kalite dikey pilotu
# Manda: v6 (A5 Saha Operasyon Komuta Merkezi — S01–S05 zorunlu)
# Domain: SPC / Cp / Cpk / kontrol kartı / Western Electric — rename-kopya değil
# =============================================================================

urun:
  kod: SPY-PRO
  ad: "SPC Proses Yetenek Analizi"
  surum: "1.0.0"
  slug: spc-proses-yetenek-analizi
  dosya: SpcProsesYetenekAnalizi.xlsx
  prefix: spy_
  satis_fiyati_tl: 9900
  hedef_kullanici: "Kalite müdürü, QA sorumlusu, süreç mühendisi (SPC), üretim müdürü"

arketip: A5
fiyat: 9900
olcek_hedefi: 20000

deger:
  satis_fiyati_tl: 9900
  Y1_danisman_ikamesi_tl: 22000
  Y2_kurulum_ikamesi_tl: 12000
  Y3_onlenen_hata_tl: 48000
  Y4_saas_yillik_ikamesi_tl: 0
  kaynak: "IATF majör uygunsuzluk / yeniden denetim kaçınma + SPC danışman/kurulum yerine iç yetenek"

deger_vektoru: ["P", "R", "K"]
uc_rol:
  - rol: "Saha / ölçüm operatörü"
    is_bitince: "Günlük altgrup X̄-R satırını ≤6 alanda kilitler"
  - rol: "Kalite müdürü / süreç mühendisi"
    is_bitince: "Cp/Cpk ve UYGUN/DİKKAT/KRİTİK/VERİ YOK kararını görür"
  - rol: "IATF / müşteri denetçisi"
    is_bitince: "RAPOR ile proses yetenek ve kontrol kartı kanıtını dosyalar"

lansman_tetigi:
  sinif: Denetim_penceresi
  aciklama: "IATF / müşteri denetimi öncesi 30–60 gün; PPAP yetenek kanıtı"
  tarih_penceresi: "iatf_denetim_oncesi"

rakip_ayrim:
  - sinif: R1_jenerik
    ayrim: "Cp ve Cpk tek formülde USL/LSL/σ zinciriyle canlı"
    karsilik: "spy_cpkOrt"
  - sinif: R1_jenerik
    ayrim: "Varlık sağlık skoru sahadan formülle türer (sabit skor yok)"
    karsilik: "spy_saglikSkor"
  - sinif: R1_jenerik
    ayrim: "Western Electric / kontrol limiti alarm eşikleri AYARLAR'da"
    karsilik: "spy_alarmListesi"
  - sinif: R2_bedava
    ayrim: "12 aylık sezonsal Cp/Cpk zinciri"
    karsilik: "spy_sezonsalTrend"
  - sinif: R4_yazilim
    ayrim: "Makrosuz, çevrimdışı; dış istatistik API bağı yok"
    karsilik: "spy_kararKapi"

serbest_alternatif:
  soru: "Alıcı bunu bedavaya nasıl yapar?"
  adaylar:
    - "Minitab/kısa kurs + elle X̄-R kartı"
    - "Ölçüm cihazı çıktısını Excel'de yüzde elle bölmek"
    - "Danışmandan tek seferlik Cp/Cpk raporu"
  ayrimlar:
    - madde: "Altgrup X̄-R, Cp, Cpk ve kontrol limiti tek satırda canlı"
      karsilik: "spy_cpkOrt"
    - madde: "Varlık sağlık skoru COUNTIF/SUMIF ile veriden türer"
      karsilik: "spy_saglikSkor"
    - madde: "Alarm eşiği AYARLAR + proses/eşik/süre listesi"
      karsilik: "spy_alarmListesi"
    - madde: "12 ay sezonsal yetenek karşılaştırması"
      karsilik: "spy_sezonsalTrend"
    - madde: "Boş dosyada VERİ YOK; UYGUN/DİKKAT/KRİTİK kapısı"
      karsilik: "spy_kararKapi"

saha:
  gunluk_giris_alan: 6
  birim_disiplini: true
  sezonsallik_ay: 12
  saglik_skor_formul: true
  alarm_esik_ayarlar: true

analitik_moduller:
  - {kod: T1, ad: "Günlük X̄ ortalaması", ad_tanimi: "spy_gunlukXbarOrt", yorum_hucresi: "spy_yorumGunluk"}
  - {kod: T2, ad: "Aylık Cpk trend", ad_tanimi: "spy_aylikCpkTrend", yorum_hucresi: "spy_yorumAylik"}
  - {kod: O1, ad: "Cpk sapma", ad_tanimi: "spy_cpkSapma", yorum_hucresi: "spy_yorumSapma"}
  - {kod: O2, ad: "Duyarlılık tornado", ad_tanimi: "spy_tornadoZirve", yorum_hucresi: "spy_yorumTornado"}
  - {kod: O3, ad: "Senaryo", ad_tanimi: "spy_senaryoKarsilastirma", yorum_hucresi: "spy_yorumSenaryo"}
  - {kod: O6, ad: "Yoğunlaşma HHI", ad_tanimi: "spy_hhi", yorum_hucresi: "spy_yorumHhi"}
  - {kod: O8, ad: "Kalite skoru", ad_tanimi: "spy_kaliteSkor", yorum_hucresi: "spy_yorumKalite"}
  - {kod: M_SEN, ad: "Senaryo motoru", ad_tanimi: "spy_senaryoMotor", yorum_hucresi: "spy_yorumSenMotor"}
  - {kod: I1, ad: "Tahmin aralık", ad_tanimi: "spy_tahminAralik", yorum_hucresi: "spy_yorumTahmin"}
  - {kod: I2, ad: "Yüzdelik P90", ad_tanimi: "spy_yuzdelikP90", yorum_hucresi: "spy_yorumP90"}

karar_kurallari:
  - kosul: "veri_yok"
    karar: "VERİ YOK"
  - kosul: "kritik_alarm_veya_saglik_dusuk"
    karar: "KRİTİK"
  - kosul: "cpk_veya_we_esik_asim"
    karar: "DİKKAT"
  - kosul: "esik_altinda"
    karar: "UYGUN"

sayfa_akisi:
  - KAPAK
  - VARLIKLAR
  - GUNLUK_GIRIS
  - DONEM_ANALIZ
  - HESAP
  - PANO
  - ALARMLAR
  - RAPOR
  - KONTROLLER
  - ORNEK_VERI
  - LISTELER
  - AYARLAR
  - KILAVUZ

denetim:
  giris_dolgu: ["FFFFF2CC"]
  koruma_sifresi: "1234"
  asgari_kb_kurali_toplam: 40
  asgari_grafik: 8
  volatil_ust_sinir: 12
  sonda_olacak_sayfalar: ["LISTELER", "AYARLAR", "KILAVUZ"]
  asgari_tablo_kapasitesi: 250
  asgari_pano_kpi: 12
  asgari_motor_adimi: 40
  asgari_derinlik_puani: 100
  asgari_ileri_modul: 2
  ikame_carpani: 3.0
  asgari_ayrim_maddesi: 5
  bos_dosya_beklenen_karar: "VERİ YOK"
  karar_sayfasi: "PANO"
  motor_sayfasi: "HESAP"
  pano_sayfasi: "PANO"
  ayarlar_sayfasi: "AYARLAR"
  modul_puanlari: {"T": 10, "O": 15, "I": 25}

testler:
  asgari_tablo_kapasitesi: 250
  olcek:
    satir: 500
    azami_hesap_saniye: 30.0

ornek_veri: ornek_veri.csv
onay:
  durum: ONAYLANDI
  not: "Hat B Y-20 — A5 SPC proses yetenek analizi sevk hedefi"
