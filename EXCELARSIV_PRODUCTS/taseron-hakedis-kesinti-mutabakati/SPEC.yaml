serbest_alternatif:
  alternatifler:
    - "Her taşeron hakedişinde KDV tevkifatı, stopaj ve diğer kesintileri elle hesaplayan hesap tablosu"
    - "Hakediş defteri ile ödeme defterini ayrı ayrı elle karşılaştırarak mutabakat çıkarma"
    - "Mali müşavirin taşeron mutabakatı için talep ettiği dönemsel danışmanlık ücreti"
    - "Ücretsiz Excel şablonları ve genel amaçlı takip araçları"
    - "Genel amaçlı yapay zekâ ile elle kurulum ve doğrulama"
  ayrimlar:
    - madde: "Her hakedişin KDV tevkifatı, gelir vergisi stopajı, SGK kesintisi ve teminatını sözleşme kartındaki oranlardan otomatik hesaplar; elle oran kurmayı gerektirmez"
      karsilik: ToplamKdvTevkifat
    - madde: "Hakediş net tutarı ile ödenen tutarı tek tabloda karşılaştırır; mutabakat farkını ve fark oranını formülle üretir"
      karsilik: MutabakatFarki
    - madde: "Geç ödeme gününü vadeyle karşılaştırır, gecikme maliyetini gecikme faizi oranından türetir"
      karsilik: GecikmeMaliyetiToplam
    - madde: "Hakediş anomali oranını Z skoruyla denetler; uç dönemleri mutabakat gerekliliği olarak raporlar"
      karsilik: modulO1AnomaliOran
    - madde: "Tornado duyarlılıkla mutabakat farkını en çok etkileyen değişkeni sıralar"
      karsilik: modulO2TornadoZirve
    - madde: "Senaryo motoru ile kötümser/baz/iyimser fark, gecikme ve kararı tek ekranda üretir"
      karsilik: modulO3SenaryoBazFark
    - madde: "Hakediş trendinden sonraki dönem tahmini ve P90 yüzdelik aralığını üretir; sonuç ad tanımlı ve raporlanabilir"
      karsilik: modulI1HakedisTahminOrta

