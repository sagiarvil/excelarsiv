urun:
  slug: taseron-hakedis-kesinti-mutabakati
  ad: "Taşeron/Alt Yüklenici Hakediş & Kesinti Mutabakatı"
  karar: "Taşeron hakedişlerindeki KDV tevkifatı, gelir vergisi stopajı ve diğer kesintileri hesaplar; hakediş ile ödeme arasındaki mutabakat farkını, geç ödeme ve gecikme maliyetini ölçer; UYGUN / İNCELE / DURDUR kararı üretir"
  hedef_kullanici: "Yüklenici firmalar, inşaat şirketleri, taşeron işlerini denetleyen mali müşavirler ve idari işler yöneticileri"
  mevzuat:
    - "KDV Kanunu ve KDV Genel Uygulama Tebliği: yapım işlerinde sorumlu sıfatıyla KDV tevkifatı (4/10)"
    - "GVK md.94: hakediş ödemelerinde gelir vergisi stopajı"
    - "SGK 5510 s. Kanun: işveren/alt işveren prim sorumluluğu"
    - "TBK md.117-120: temerrüt ve gecikme faizi"
  giris:
    sozlesme_karti:
      alanlar: [yukleniciFirma, tasseronFirma, sozlesmeAdi, sozlesmeTarihi, sozlesmeBedeli, isBaslangic, isBitis, sozlesmeVadeGun]
    hakedisler:
      tablo: tblHakedis
      kolonlar: [Dönem, Hakediş Tarihi, Brüt Hakediş]
    odemeler:
      tablo: tblOdeme
      kolonlar: [Dönem, Hakediş Tarihi, Ödeme Tarihi, Ödenen Tutar]
  esikler:
    mutabakat_tolerans: 100        # mutabakat farkı kabul toleransı (₺)
    mutabakat_farki_esik: 0.02     # mutabakat farkı oranı uyarı eşiği
    gec_odeme_esik: 30             # geç ödeme eşiği (gün)
    kesinti_esik: 0.25             # toplam kesinti oranı uyarı eşiği
    anomali_z_esik: 2.00           # hakediş anomali |Z| eşiği
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, mutabakat farkı, geç ödeme, kesinti oranı ve aksiyon önerileri"

