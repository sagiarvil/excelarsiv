serbest_alternatif:
  alternatifler:
    - "Reçete maliyetini muhasebe/üretim sisteminden veya hesap makinesiyle kalem kalem çıkarmak"
    - "Hammadde zamlarını teklif ve faturalardan elle toplayıp yeni reçete maliyetini ayrı ayrı güncellemek"
    - "Fire, işçilik ve genel üretim giderlerini ayrı Excel sayfalarında tutup birim maliyeti manuel birleştirmek"
    - "Zam sonrası fiyatı hedef kâr marjına göre yeniden fiyatlamadan sezgisel olarak güncellemek"
    - "Her ürün için eski/yeni maliyet farkını aylarca elle toplayıp yönetici raporu ve zam gerekçesi hazırlamak"
  ayrimlar:
    - madde: "Reçete kalemlerinde miktar, birim fiyat, fire ve zam oranlarından eski/yeni reçete maliyetini tek tabloda canlı formülle üretir; alternatifte her kalem hesap makinesiyle çıkarılır."
      karsilik: UretimToplamZamSonrasiMaliyet
    - madde: "Zam yansıtma sonrası genel maliyet artışını ve hedef kâr marjını koruyan önerilen satış fiyatını ürün bazında üretir; alternatifte fiyat güncellemesi sezgiseldir."
      karsilik: UretimEnYuksekArtis
    - madde: "Genel maliyet artışını eşiklerle karşılaştırarak ZAM YANSIT/KISMİ YANSIT/FİYATI KORU kararını gerekçesi ve önerilen aksiyonlarla üretir; alternatifte karar belgesi elle yazılır."
      karsilik: UretimKarar
    - madde: "Zam senaryosu bant aralığı ve hammadde duyarlılık (tornado) analizi ile maliyet artışının belirsizlik aralığını ve en etkili değişkeni gösterir; alternatifte duyarlılık analizi yoktur."
      karsilik: modulO3Senaryo
    - madde: "Maliyet yoğunlaşmasını (HHI), kalem fark sapmasını ve veri kalite skorunu ölçerek karar kapısına güven katmanı ekler; alternatifte bu analizler yoktur."
      karsilik: modulO8KaliteSkor
