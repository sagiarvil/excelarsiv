  karar: "Reçetedeki hammadde kalemlerinin miktar, birim fiyat, fire ve zam oranlarıyla eski ve yeni reçete maliyetini üretir; hammadde zamlarının ürün bazında maliyet artışına dönüşümünü ve hedef kâr marjını koruyan önerilen satış fiyatını hesaplar; genel maliyet artışını eşiklerle karşılaştırarak ZAM YANSIT/KISMİ YANSIT/FİYATI KORU kararını gerekçesiyle üretir ve önerilen aksiyonları gösterir"
