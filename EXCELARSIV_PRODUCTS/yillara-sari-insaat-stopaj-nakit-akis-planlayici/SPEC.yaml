urun:
  slug: yillara-sari-insaat-stopaj-nakit-akis-planlayici
  ad: "Yıllara Sari İnşaat Stopaj & Nakit Akış Planlayıcı"
  karar: "Yıllara sari inşaat işlerinde hakedişlerin KDV tevkifatını, gelir vergisi stopajını, dönemsel kârı, nakit akışını ve vergi yükünü hesaplamak; vergi ve nakit riskine karşı aksiyon üretmek"
  hedef_kullanici: "Yıllara sari inşaat işleri yapan yükleniciler, kurumsal firmalar ve mali müşavirler"
  mevzuat:
    - "GVK md.42-44: yıllara sari inşaat ve onarma işlerinde kârın işin bittiği yıl tespiti"
    - "GVK md.94: hakediş ödemelerinde gelir vergisi stopajı (yıllara sari işlerde %5)"
    - "KDV Genel Uygulama Tebliği: yapım işlerinde sorumlu sıfatıyla KDV tevkifatı (4/10)"
    - "Kurumlar Vergisi Kanunu: geçici vergi ve kurumlar vergisi oranları"
  giris:
    proje_karti:
      alanlar: [sozlesmeAdi, isveren, yuklenici, sozlesmeTarihi, sozlesmeBedeli, isBaslangic, isBitis, isTur, kdvTevkifatli]
    yillik_plan:
      tablo: tblYil
      kolonlar: [Yıl, Planlanan Hakediş, İşçilik, Malzeme, Alt Taşeron, Genel Gider]
    hakedisler:
      tablo: tblHakedis
      kolonlar: [Dönem, Hakediş Tarihi, Brüt Hakediş]
    nakit_akisi:
      tablo: tblNakit
      kolonlar: [Dönem, Net Hakediş Tahsilatı, Diğer Gelir, İşçilik Ödemesi, Malzeme Ödemesi, Alt Taşeron Ödemesi, Genel Gider, Kredi Anapara, Kredi Faiz]
    vergi_plani:
      tablo: tblVergi
      kolonlar: [Yıl]
  esikler:
    kar_min_oran: 0.10       # kabul edilebilir asgari kâr oranı
    dscr_esik: 1.25          # asgari borç karşılama oranı
    nakit_acik_tolerans: 0   # nakit açığı kabul toleransı (₺)
    vergi_yuku_esik: 0.30    # vergi yükü uyarı eşiği
    anomali_z_esik: 2.00     # hakediş anomali |Z| eşiği
    veri_kalite_iyi: 90
    veri_kalite_orta: 70
  rapor: "A4, PDF'e hazır; yönetici özeti, kâr oranı, nakit açığı, DSCR, vergi yükü ve aksiyon önerileri"

