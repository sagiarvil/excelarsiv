serbest_alternatif:
  alternatifler:
    - "Her hakedişte KDV tevkifatı ve gelir vergisi stopajını elle hesaplayan hesap tablosu"
    - "Mali müşavirin yıllara sari iş stopaj ve vergi planı için talep ettiği danışmanlık ücreti"
    - "Ücretsiz Excel şablonları ve genel amaçlı nakit akış hesaplayıcıları"
    - "Genel amaçlı yapay zekâ ile elle kurulum ve doğrulama"
  ayrimlar:
    - madde: "Her hakedişin KDV tevkifatı ve gelir vergisi stopajını sözleşme kartındaki oranlardan otomatik hesaplar; elle oran kurmayı gerektirmez"
      karsilik: ToplamKdvTevkifat
    - madde: "Nakit akışını dönem dönem kümülatif takip eder; nakit açığını ve açık dönemlerini formülle işaretler"
      karsilik: NakitAcik
    - madde: "Geçici vergi ve kurumlar vergisi planını stopaj mahsubuyla üretir; vergi yükünü kâra oranlar"
      karsilik: ToplamOdenekVergi
    - madde: "Hakediş anomali oranını Z skoruyla denetler; uç dönemleri mutabakat gerekliliği olarak raporlar"
      karsilik: modulO1AnomaliOran
    - madde: "Tornado duyarlılıkla kâr oranını en çok etkileyen değişkeni sıralar"
      karsilik: modulO2TornadoZirve
    - madde: "Senaryo motoru ile kötümser/baz/iyimser kâr, DSCR ve kararı tek ekranda üretir"
      karsilik: modulO3SenaryoBazKar
    - madde: "Hakediş trendinden sonraki dönem tahmini ve P90 yüzdelik aralığını üretir; sonuç ad tanımlı ve raporlanabilir"
      karsilik: modulI1HakedisTahminOrta
