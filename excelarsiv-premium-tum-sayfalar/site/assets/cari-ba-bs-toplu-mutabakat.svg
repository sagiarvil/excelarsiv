<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_cari-ba-bs-toplu-mutabakat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#86198f"/>
    </linearGradient>

    <!-- Glass Floor Gradient -->
    <linearGradient id="floorGrad_cari-ba-bs-toplu-mutabakat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- 3D Bar Gradients -->
    <linearGradient id="accentGrad_cari-ba-bs-toplu-mutabakat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="barFront_cari-ba-bs-toplu-mutabakat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="barSide_cari-ba-bs-toplu-mutabakat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_cari-ba-bs-toplu-mutabakat" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow_cari-ba-bs-toplu-mutabakat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
  </defs>

  <!-- Deep 3D Studio Canvas -->
  <rect width="960" height="600" fill="url(#bgGrad_cari-ba-bs-toplu-mutabakat)"/>

  <!-- Radial Atmosphere Light -->
  <circle cx="500" cy="220" r="380" fill="rgba(244,114,182,0.3)" filter="url(#glow_cari-ba-bs-toplu-mutabakat)"/>

  <!-- 3D Isometric Floor Grid -->
  <g opacity="0.18">
    <path d="M 120 440 L 480 260 L 840 440 L 480 580 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <path d="M 210 440 L 480 305 L 750 440 L 480 535 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M 300 440 L 480 350 L 660 440 L 480 490 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- Floor Matrix Grid Lines -->
    <line x1="240" y1="380" x2="600" y2="560" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="360" y1="320" x2="720" y2="500" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="720" y1="380" x2="360" y2="560" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="600" y1="320" x2="240" y2="500" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>

  <!-- Isometric 3D Platform Base -->
  <g filter="url(#shadow_cari-ba-bs-toplu-mutabakat)">
    <!-- Top Face -->
    <polygon points="480,270 780,380 480,490 180,380" fill="url(#floorGrad_cari-ba-bs-toplu-mutabakat)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Left Front Face -->
    <polygon points="180,380 480,490 480,510 180,400" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Right Front Face -->
    <polygon points="480,490 780,380 780,400 480,510" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Dynamic 3D Isometric Bar Graph Pillars Rising From Floor -->
  <!-- Pillar 1 -->
  <g transform="translate(290, 291)">
    <!-- Front Face -->
    <polygon points="0,119 34,133 34,14 0,0" fill="url(#barFront_cari-ba-bs-toplu-mutabakat)"/>
    <!-- Right Face (3D depth) -->
    <polygon points="34,133 60,119 60,0 34,14" fill="#fb7185" opacity="0.8"/>
    <!-- Top Face -->
    <polygon points="0,0 26,-14 60,0 34,14" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(370, 258)">
    <polygon points="0,172 36,187 36,15 0,0" fill="url(#barFront_cari-ba-bs-toplu-mutabakat)"/>
    <polygon points="36,187 64,172 64,0 36,15" fill="#fb7185" opacity="0.8"/>
    <polygon points="0,0 28,-15 64,0 36,15" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Pillar 3 (Peak Pillar) -->
  <g transform="translate(450, 275)">
    <polygon points="0,175 40,192 40,17 0,0" fill="#f472b6"/>
    <polygon points="40,192 72,175 72,0 40,17" fill="#fb7185" opacity="0.85"/>
    <polygon points="0,0 32,-17 72,0 40,17" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(540, 172)">
    <polygon points="0,253 36,268 36,15 0,0" fill="url(#barFront_cari-ba-bs-toplu-mutabakat)"/>
    <polygon points="36,268 64,253 64,0 36,15" fill="#fb7185" opacity="0.75"/>
    <polygon points="0,0 28,-15 64,0 36,15" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Pillar 5 -->
  <g transform="translate(620, 140)">
    <polygon points="0,260 34,274 34,14 0,0" fill="url(#barFront_cari-ba-bs-toplu-mutabakat)"/>
    <polygon points="34,274 60,260 60,0 34,14" fill="#fb7185" opacity="0.8"/>
    <polygon points="0,0 26,-14 60,0 34,14" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 3D Floating Curved Trend Line with glowing nodes -->
  <path d="M 320 291 Q 400 188 480 255 T 650 130" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow_cari-ba-bs-toplu-mutabakat)"/>
  <path d="M 320 291 Q 400 188 480 255 T 650 130" 
        fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Indicator Spheres -->
  <circle cx="320" cy="291" r="5" fill="#ffffff" filter="url(#glow_cari-ba-bs-toplu-mutabakat)"/>
  <circle cx="480" cy="255" r="7" fill="#ffffff" filter="url(#glow_cari-ba-bs-toplu-mutabakat)"/>
  <circle cx="650" cy="130" r="6" fill="#ffffff" filter="url(#glow_cari-ba-bs-toplu-mutabakat)"/>

  <!-- Floating Glassmorphic 3D Card HUD in Background -->
  <g transform="translate(180, 75)" filter="url(#shadow_cari-ba-bs-toplu-mutabakat)">
    <!-- Glass Background with subtle 3D tilt -->
    <rect width="600" height="150" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" backdrop-filter="blur(14px)"/>
    
    <!-- Top Accent Stripe -->
    <rect x="2" y="2" width="596" height="4" rx="2" fill="url(#accentGrad_cari-ba-bs-toplu-mutabakat)"/>

    <!-- Category Pill -->
    <rect x="28" y="24" width="130" height="26" rx="13" fill="rgba(244,114,182,0.3)" stroke="#f472b6" stroke-width="1"/>
    <text x="93" y="41" fill="#f472b6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">muhasebe-ve-vergi</text>

    <!-- Excel 3D Badge -->
    <g transform="translate(530, 22)">
      <rect width="42" height="30" rx="6" fill="#107c41" filter="url(#shadow_cari-ba-bs-toplu-mutabakat)"/>
      <text x="21" y="21" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="900" text-anchor="middle">XLS</text>
    </g>

    <!-- Product Title in Card -->
    <text x="28" y="85" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">
      Cari ve Ba-Bs Toplu Mutabakat Motoru
    </text>

    <!-- Subtitle / Metrics -->
    <text x="28" y="115" fill="rgba(255,255,255,0.7)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500">
      Kurumsal Karar Destek Modeli · Canlı Yönetim Kokpiti
    </text>

    <!-- High-Converting Value Badge (1.999 TL & Instant Delivery) -->
    <g transform="translate(420, 100)">
      <rect width="162" height="28" rx="6" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="88" y="19" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Anında İndir · 1.999 TL</text>
    </g>
  </g>

  <!-- 3D Floating Mini KPI Ring / Donut (Left Side) -->
  <g transform="translate(140, 240)" filter="url(#shadow_cari-ba-bs-toplu-mutabakat)">
    <ellipse cx="40" cy="40" rx="36" ry="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
    <ellipse cx="40" cy="40" rx="36" ry="24" fill="none" stroke="#f472b6" stroke-width="8" stroke-dasharray="140 60"/>
    <text x="40" y="44" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="800" text-anchor="middle">%98.4</text>
  </g>

  <!-- 3D Floating Mini KPI Stat (Right Side) -->
  <g transform="translate(760, 230)" filter="url(#shadow_cari-ba-bs-toplu-mutabakat)">
    <polygon points="0,20 60,0 120,20 60,40" fill="url(#floorGrad_cari-ba-bs-toplu-mutabakat)" stroke="#fb7185" stroke-width="1.5"/>
    <polygon points="0,20 60,40 60,55 0,35" fill="rgba(0,0,0,0.4)"/>
    <polygon points="60,40 120,20 120,35 60,55" fill="rgba(0,0,0,0.2)"/>
    <text x="60" y="25" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="800" text-anchor="middle">ROI +%42</text>
  </g>
</svg>