<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <!-- Glass Floor Gradient -->
    <linearGradient id="floorGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- 3D Bar Gradients -->
    <linearGradient id="accentGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="barFront_klinik-saglik-merkezi-fizibilite-ve-karlilik" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="barSide_klinik-saglik-merkezi-fizibilite-ve-karlilik" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_klinik-saglik-merkezi-fizibilite-ve-karlilik" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow_klinik-saglik-merkezi-fizibilite-ve-karlilik" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
  </defs>

  <!-- Deep 3D Studio Canvas -->
  <rect width="960" height="600" fill="url(#bgGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>

  <!-- Radial Atmosphere Light -->
  <circle cx="500" cy="220" r="380" fill="rgba(251,191,36,0.3)" filter="url(#glow_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>

  <!-- 3D Isometric Floor Grid -->
  <g opacity="0.18">
    <path d="M 120 440 L 480 260 L 840 440 L 480 580 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <path d="M 210 440 L 480 305 L 750 440 L 480 535 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M 300 440 L 480 350 L 660 440 L 480 490 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- Floor Matrix Grid Lines -->
    <line x1="240" y1="380" x2="600" y2="560" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="360" y1="320" x2="720" y2="500" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="720" y1="380" x2="360" y2="560" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="600" y1="320" x2="240" y2="500" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>

  <!-- Isometric 3D Platform Base -->
  <g filter="url(#shadow_klinik-saglik-merkezi-fizibilite-ve-karlilik)">
    <!-- Top Face -->
    <polygon points="480,270 780,380 480,490 180,380" fill="url(#floorGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Left Front Face -->
    <polygon points="180,380 480,490 480,510 180,400" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Right Front Face -->
    <polygon points="480,490 780,380 780,400 480,510" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Dynamic 3D Isometric Bar Graph Pillars Rising From Floor -->
  <!-- Pillar 1 -->
  <g transform="translate(290, 276)">
    <!-- Front Face -->
    <polygon points="0,134 34,148 34,14 0,0" fill="url(#barFront_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
    <!-- Right Face (3D depth) -->
    <polygon points="34,148 60,134 60,0 34,14" fill="#f59e0b" opacity="0.8"/>
    <!-- Top Face -->
    <polygon points="0,0 26,-14 60,0 34,14" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(370, 237)">
    <polygon points="0,193 36,208 36,15 0,0" fill="url(#barFront_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
    <polygon points="36,208 64,193 64,0 36,15" fill="#f59e0b" opacity="0.8"/>
    <polygon points="0,0 28,-15 64,0 36,15" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Pillar 3 (Peak Pillar) -->
  <g transform="translate(450, 190)">
    <polygon points="0,260 40,277 40,17 0,0" fill="#fbbf24"/>
    <polygon points="40,277 72,260 72,0 40,17" fill="#f59e0b" opacity="0.85"/>
    <polygon points="0,0 32,-17 72,0 40,17" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(540, 190)">
    <polygon points="0,235 36,250 36,15 0,0" fill="url(#barFront_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
    <polygon points="36,250 64,235 64,0 36,15" fill="#f59e0b" opacity="0.75"/>
    <polygon points="0,0 28,-15 64,0 36,15" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Pillar 5 -->
  <g transform="translate(620, 112)">
    <polygon points="0,288 34,302 34,14 0,0" fill="url(#barFront_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
    <polygon points="34,302 60,288 60,0 34,14" fill="#f59e0b" opacity="0.8"/>
    <polygon points="0,0 26,-14 60,0 34,14" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 3D Floating Curved Trend Line with glowing nodes -->
  <path d="M 320 276 Q 400 167 480 170 T 650 102" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
  <path d="M 320 276 Q 400 167 480 170 T 650 102" 
        fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Indicator Spheres -->
  <circle cx="320" cy="276" r="5" fill="#ffffff" filter="url(#glow_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
  <circle cx="480" cy="170" r="7" fill="#ffffff" filter="url(#glow_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
  <circle cx="650" cy="102" r="6" fill="#ffffff" filter="url(#glow_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>

  <!-- Floating Glassmorphic 3D Card HUD in Background -->
  <g transform="translate(180, 75)" filter="url(#shadow_klinik-saglik-merkezi-fizibilite-ve-karlilik)">
    <!-- Glass Background with subtle 3D tilt -->
    <rect width="600" height="150" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" backdrop-filter="blur(14px)"/>
    
    <!-- Top Accent Stripe -->
    <rect x="2" y="2" width="596" height="4" rx="2" fill="url(#accentGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>

    <!-- Category Pill -->
    <rect x="28" y="24" width="130" height="26" rx="13" fill="rgba(251,191,36,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="93" y="41" fill="#fbbf24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">butce-ve-planlama</text>

    <!-- Excel 3D Badge -->
    <g transform="translate(530, 22)">
      <rect width="42" height="30" rx="6" fill="#107c41" filter="url(#shadow_klinik-saglik-merkezi-fizibilite-ve-karlilik)"/>
      <text x="21" y="21" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="900" text-anchor="middle">XLS</text>
    </g>

    <!-- Product Title in Card -->
    <text x="28" y="85" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">
      Klinik / Sağlık Merkezi Fizibilite ve Ka…
    </text>

    <!-- Subtitle / Metrics -->
    <text x="28" y="115" fill="rgba(255,255,255,0.7)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500">
      Dinamik Bordro &amp; Puantaj Matrisi · 3D Analiz Paneli
    </text>

    <!-- High-Converting Value Badge (999 TL & Instant Delivery) -->
    <g transform="translate(420, 100)">
      <rect width="152" height="28" rx="6" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="82" y="19" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Anında İndir · 999 TL</text>
    </g>
  </g>

  <!-- 3D Floating Mini KPI Ring / Donut (Left Side) -->
  <g transform="translate(140, 240)" filter="url(#shadow_klinik-saglik-merkezi-fizibilite-ve-karlilik)">
    <ellipse cx="40" cy="40" rx="36" ry="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
    <ellipse cx="40" cy="40" rx="36" ry="24" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="140 60"/>
    <text x="40" y="44" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="800" text-anchor="middle">%98.4</text>
  </g>

  <!-- 3D Floating Mini KPI Stat (Right Side) -->
  <g transform="translate(760, 230)" filter="url(#shadow_klinik-saglik-merkezi-fizibilite-ve-karlilik)">
    <polygon points="0,20 60,0 120,20 60,40" fill="url(#floorGrad_klinik-saglik-merkezi-fizibilite-ve-karlilik)" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="0,20 60,40 60,55 0,35" fill="rgba(0,0,0,0.4)"/>
    <polygon points="60,40 120,20 120,35 60,55" fill="rgba(0,0,0,0.2)"/>
    <text x="60" y="25" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="800" text-anchor="middle">ROI +%42</text>
  </g>
</svg>