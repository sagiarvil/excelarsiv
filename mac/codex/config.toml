# config.toml — OpenAI Codex CLI & Master Suite Yapılandırması
# Konum: codex-master-suite/config.toml veya ~/.codex/config.toml

[project]
name = "codex-master-suite"
version = "1.4.1"
description = "Antigravity & OpenAI Codex Multi-Agent Master Architecture"
default_language = "turkish_output"

[behavior]
zero_preamble = true
surgical_precision = true
ast_budget_kb = 14
strict_utf8_nobom = true
user_output_language = "tr"
internal_instruction_density = "high_english"

[context]
project_doc_fallback_filenames = [
    "AGENTS.md",
    "README.md",
    "rules/01_EVRENSEL_KURALLAR.md",
    "rules/python-rules.md",
    "rules/typescript-rules.md"
]
project_doc_max_bytes = 1048576

[skills]
skills_directory = "skills"
auto_load_all = true

[runtime]
resolver_script = "scripts/runtime_resolver.js"
installer_script = "scripts/tool_installer.js"
updater_script = "scripts/self_updater.js"
synthesizer_script = "scripts/language_synthesizer.js"
