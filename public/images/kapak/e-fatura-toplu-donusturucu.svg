<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#0d5c3a" />
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="softCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Saf Açık Tema Arka Plan (1000x1000 Kare Alan) -->
  <rect width="1000" height="1000" fill="#ffffff" />

  <!-- Dış Kenar Çerçeve (820x820 Çizim Alanı: x=90, y=90, %82 Doluluk) -->
  <rect x="90" y="90" width="820" height="820" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5" filter="url(#softCard)" />

  <!-- Üst Başlık & Kategori Rozeti (x: 130, y: 130) -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#107c41" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#334155" letter-spacing="0.5">MUHASEBE-VE-VERGI</text>
    
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">e-Fatura Toplu Dönüştürücü</text>
  </g>

  <!-- 1:1 Kare Alanını Dolduran Benzersiz İnfografik / Çizim (x: 130, y: 220, w: 740, h: 650) -->
  <g transform="translate(130, 220)">
    
    <rect x="20" y="20" width="700" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <g transform="translate(100, 100)">
      <!-- Dişli Çark Dönüştürücü Şeması -->
      <circle cx="150" cy="150" r="100" fill="#dbeafe" stroke="#2563eb" stroke-width="4" />
      <text x="150" y="145" font-family="system-ui" font-size="18" font-weight="900" fill="#1e40af" text-anchor="middle">XML / UBL</text>
      <text x="150" y="170" font-family="system-ui" font-size="12" font-weight="700" fill="#3b82f6" text-anchor="middle">Giriş Dosyası</text>
      <circle cx="360" cy="150" r="100" fill="#dcfce7" stroke="#107c41" stroke-width="4" />
      <text x="360" y="145" font-family="system-ui" font-size="18" font-weight="900" fill="#065f46" text-anchor="middle">EXCEL / PDF</text>
      <text x="360" y="170" font-family="system-ui" font-size="12" font-weight="700" fill="#107c41" text-anchor="middle">Net Çıktı</text>
      <path d="M 230 110 L 280 110" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      <polygon points="280,110 265,100 265,120" fill="#0f172a" />
      <path d="M 280 190 L 230 190" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      <polygon points="230,190 245,180 245,200" fill="#0f172a" />
    </g>
    
  </g>
</svg>