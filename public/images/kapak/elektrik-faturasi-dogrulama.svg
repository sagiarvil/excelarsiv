<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FİNANSAL YÖNETİM</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Elektrik Faturasi Dogrulama</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(340, 80)"><line x1="0" y1="0" x2="560" y2="0" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="90" x2="560" y2="90" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="180" x2="560" y2="180" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="270" x2="560" y2="270" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="360" x2="560" y2="360" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="360" x2="560" y2="360" stroke="#94a3b8" stroke-width="2"/><rect x="30" y="262" width="70" height="98" rx="8" fill="#f87171" /><rect x="135" y="237" width="70" height="123" rx="8" fill="#fb923c" /><rect x="240" y="148" width="70" height="212" rx="8" fill="#fbbf24" /><rect x="345" y="75" width="70" height="285" rx="8" fill="#38bdf8" /><rect x="450" y="15" width="70" height="345" rx="8" fill="#10b981" /><path d="M 40 280 Q 240 250 490 40" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/><polygon points="490,20 508,55 470,50" fill="#ef4444" /></g>
  </g>
</svg>