<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">YATIRIM &amp; FİZİBİLİTE</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Filo Yatirim &amp; Arac Yenileme Fizibilite</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g>
      <!-- Base Sector -->
      <path d="M 620 250 L 780 250 A 160 160 0 1 1 659.7903819463768 95.02669421941903 Z" fill="#047857" />
      <text x="580" y="310" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="900" text-anchor="middle">%79</text>
      
      <!-- Exploded Wedge -->
      <path d="M 644 226 L 683.7903819463768 71.02669421941903 A 160 160 0 0 1 804 226 Z" fill="#10b981" />
      
      <!-- Callout Line -->
      <polyline points="756,146 788,98 852,98" fill="none" stroke="#0f172a" stroke-width="2" />
      <text x="860" y="104" fill="#0f172a" font-family="sans-serif" font-size="24" font-weight="900">%21</text>
    </g>
  </g>
</svg>