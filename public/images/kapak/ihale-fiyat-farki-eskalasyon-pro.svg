<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FİNANSAL YÖNETİM</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Ihale Fiyat Farki Eskalasyon Pro</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(320, 80)"><rect x="0" y="260" width="125" height="80" rx="12" fill="#93c5fd" /><text x="62" y="292" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">#1</text><rect x="145" y="180" width="125" height="160" rx="12" fill="#60a5fa" /><text x="207" y="212" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">#2</text><rect x="290" y="100" width="125" height="240" rx="12" fill="#3b82f6" /><text x="352" y="132" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">#3</text><rect x="435" y="20" width="125" height="320" rx="12" fill="#1d4ed8" /><text x="497" y="52" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">#4</text><line x1="0" y1="340" x2="580" y2="340" stroke="#cbd5e1" stroke-width="3"/></g>
  </g>
</svg>