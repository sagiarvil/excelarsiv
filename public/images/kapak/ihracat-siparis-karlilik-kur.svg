<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FİNANSAL YÖNETİM</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Ihracat Siparis Karlilik Kur</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(300, 80)"><line x1="0" y1="0" x2="0" y2="340" stroke="#f1f5f9" stroke-width="2"/><text x="0" y="365" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Hafta 1</text><line x1="150" y1="0" x2="150" y2="340" stroke="#f1f5f9" stroke-width="2"/><text x="150" y="365" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Hafta 4</text><line x1="300" y1="0" x2="300" y2="340" stroke="#f1f5f9" stroke-width="2"/><text x="300" y="365" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Hafta 7</text><line x1="450" y1="0" x2="450" y2="340" stroke="#f1f5f9" stroke-width="2"/><text x="450" y="365" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Hafta 10</text><line x1="600" y1="0" x2="600" y2="340" stroke="#f1f5f9" stroke-width="2"/><text x="600" y="365" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Hafta 13</text><rect x="40" y="20" width="220" height="42" rx="10" fill="#059669" /><text x="56" y="46" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Nakit Planlama</text><rect x="160" y="100" width="260" height="42" rx="10" fill="#10b981" /><text x="176" y="126" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Kredi Mutabakatı</text><rect x="260" y="180" width="180" height="42" rx="10" fill="#34d399" /><text x="276" y="206" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Stok Envanteri</text><rect x="380" y="260" width="180" height="42" rx="10" fill="#0284c7" /><text x="396" y="286" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Yönetim Onayı</text></g>
  </g>
</svg>