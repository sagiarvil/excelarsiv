<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">NAKİT AKIŞI</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Konkordato Nakit Akis On Projesi</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(300, 80)"><text x="-20" y="26" fill="#334155" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="end">Brüt Satış</text><rect x="0" y="0" width="600" height="40" rx="8" fill="#f1f5f9" /><rect x="0" y="6" width="480" height="28" rx="6" fill="#10b981" /><line x1="440" y1="-4" x2="440" y2="44" stroke="#ef4444" stroke-width="4" stroke-linecap="round" /><text x="-20" y="116" fill="#334155" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="end">Net Tahsilat</text><rect x="0" y="90" width="600" height="40" rx="8" fill="#f1f5f9" /><rect x="0" y="96" width="360" height="28" rx="6" fill="#10b981" /><line x1="400" y1="86" x2="400" y2="134" stroke="#ef4444" stroke-width="4" stroke-linecap="round" /><text x="-20" y="206" fill="#334155" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="end">Kira & Genel Gider</text><rect x="0" y="180" width="600" height="40" rx="8" fill="#f1f5f9" /><rect x="0" y="186" width="210" height="28" rx="6" fill="#10b981" /><line x1="260" y1="176" x2="260" y2="224" stroke="#ef4444" stroke-width="4" stroke-linecap="round" /><text x="-20" y="296" fill="#334155" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="end">EBITDA</text><rect x="0" y="270" width="600" height="40" rx="8" fill="#f1f5f9" /><rect x="0" y="276" width="390" height="28" rx="6" fill="#10b981" /><line x1="350" y1="266" x2="350" y2="314" stroke="#ef4444" stroke-width="4" stroke-linecap="round" /></g>
  </g>
</svg>