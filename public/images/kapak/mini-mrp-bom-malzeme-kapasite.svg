<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#0d5c3a" />
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="softCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Saf Açık Tema Arka Plan (1000x1000 Kare Alan) -->
  <rect width="1000" height="1000" fill="#ffffff" />

  <!-- Dış Kenar Çerçeve (820x820 Çizim Alanı: x=90, y=90, %82 Doluluk) -->
  <rect x="90" y="90" width="820" height="820" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5" filter="url(#softCard)" />

  <!-- Üst Başlık & Kategori Rozeti (x: 130, y: 130) -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#107c41" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#334155" letter-spacing="0.5">STOK-VE-URETIM</text>
    
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Mini Mrp Bom Malzeme Kapasite</text>
  </g>

  <!-- 1:1 Kare Alanını Dolduran Benzersiz İnfografik / Çizim (x: 130, y: 220, w: 740, h: 650) -->
  <g transform="translate(130, 220)">
    
    <rect x="20" y="20" width="700" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <g transform="translate(100, 50)">
      <!-- Ürün Ağacı (BOM) Hiyerarşisi -->
      <rect x="180" y="20" width="160" height="60" rx="8" fill="#1e293b" /><text x="260" y="55" font-family="system-ui" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">MAMUL (100 ADET)</text>
      <line x1="260" y1="80" x2="260" y2="130" stroke="#94a3b8" stroke-width="3" />
      <line x1="120" y1="130" x2="400" y2="130" stroke="#94a3b8" stroke-width="3" />
      <line x1="120" y1="130" x2="120" y2="160" stroke="#94a3b8" stroke-width="3" />
      <line x1="400" y1="130" x2="400" y2="160" stroke="#94a3b8" stroke-width="3" />
      <rect x="40" y="160" width="160" height="60" rx="8" fill="#2563eb" /><text x="120" y="195" font-family="system-ui" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Yarı Mamul A</text>
      <rect x="320" y="160" width="160" height="60" rx="8" fill="#2563eb" /><text x="400" y="195" font-family="system-ui" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Yarı Mamul B</text>
      <rect x="140" y="270" width="240" height="80" rx="12" fill="#dcfce7" stroke="#107c41" stroke-width="2" />
      <text x="260" y="318" font-family="system-ui" font-size="16" font-weight="900" fill="#0d5c3a" text-anchor="middle">Kapasite İhtiyacı: %88</text>
    </g>
    
  </g>
</svg>