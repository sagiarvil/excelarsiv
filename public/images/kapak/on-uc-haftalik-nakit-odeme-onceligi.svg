<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">NAKİT AKIŞI</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">On Uc Haftalik Nakit Odeme Onceligi</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(320, 80)"><line x1="0" y1="0" x2="600" y2="0" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="90" x2="600" y2="90" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="180" x2="600" y2="180" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="270" x2="600" y2="270" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="360" x2="600" y2="360" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="360" x2="600" y2="360" stroke="#cbd5e1" stroke-width="2"/><polygon points="5,360 60,145 115,360" fill="#064e3b" opacity="0.9" /><text x="60" y="133" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">215</text><polygon points="125,360 180,13 235,360" fill="#047857" opacity="0.9" /><text x="180" y="1" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">347</text><polygon points="245,360 300,91 355,360" fill="#059669" opacity="0.9" /><text x="300" y="79" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">269</text><polygon points="365,360 420,48 475,360" fill="#10b981" opacity="0.9" /><text x="420" y="36" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">312</text><polygon points="485,360 540,211 595,360" fill="#34d399" opacity="0.9" /><text x="540" y="199" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">149</text></g>
  </g>
</svg>