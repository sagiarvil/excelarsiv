<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#0d5c3a" />
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="softCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Saf Açık Tema Arka Plan (1000x1000 Kare Alan) -->
  <rect width="1000" height="1000" fill="#ffffff" />

  <!-- Dış Kenar Çerçeve (820x820 Çizim Alanı: x=90, y=90, %82 Doluluk) -->
  <rect x="90" y="90" width="820" height="820" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5" filter="url(#softCard)" />

  <!-- Üst Başlık & Kategori Rozeti (x: 130, y: 130) -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#107c41" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#334155" letter-spacing="0.5">STOK-VE-URETIM</text>
    
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Sekiz D Duzeltici Faaliyet Dosya</text>
  </g>

  <!-- 1:1 Kare Alanını Dolduran Benzersiz İnfografik / Çizim (x: 130, y: 220, w: 740, h: 650) -->
  <g transform="translate(130, 220)">
    
    <rect x="20" y="20" width="700" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <g transform="translate(100, 40)">
      <polygon points="250,40 380,90 430,220 380,350 250,400 120,350 70,220 120,90" fill="none" stroke="#2563eb" stroke-width="4" />
      <circle cx="250" cy="40" r="14" fill="#107c41" /><text x="250" y="25" font-family="system-ui" font-size="12" font-weight="800" fill="#107c41" text-anchor="middle">D1: Ekip</text>
      <circle cx="380" cy="90" r="14" fill="#107c41" /><text x="400" y="85" font-family="system-ui" font-size="12" font-weight="800" fill="#107c41">D2: Tanım</text>
      <circle cx="430" cy="220" r="14" fill="#107c41" /><text x="450" y="225" font-family="system-ui" font-size="12" font-weight="800" fill="#107c41">D3: Önlem</text>
      <circle cx="380" cy="350" r="14" fill="#107c41" /><text x="400" y="365" font-family="system-ui" font-size="12" font-weight="800" fill="#107c41">D4: Kök Neden</text>
      <circle cx="250" cy="400" r="14" fill="#107c41" /><text x="250" y="430" font-family="system-ui" font-size="12" font-weight="800" fill="#107c41" text-anchor="middle">D5: Kalıcı Eylem</text>
      <text x="250" y="215" font-family="system-ui" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">8D SİSTEMİ</text>
      <text x="250" y="245" font-family="system-ui" font-size="13" font-weight="700" fill="#107c41" text-anchor="middle">Otomotiv &amp; Havacılık</text>
    </g>
    
  </g>
</svg>