<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">E-TİCARET &amp; PAZARYERİ</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Trendyol Komisyon Sonrasi Net Kar</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(620, 80)"><rect x="-230" y="0" width="460" height="56" rx="12" fill="#2563eb" /><text x="0" y="36" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">Toplam Talep: 1.250</text><rect x="-170" y="80" width="340" height="56" rx="12" fill="#3b82f6" /><text x="0" y="116" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">Teklif Aşaması: 640</text><rect x="-120" y="160" width="240" height="56" rx="12" fill="#10b981" /><text x="0" y="196" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">Sözleşme: 280</text><rect x="-70" y="240" width="140" height="56" rx="12" fill="#047857" /><text x="0" y="276" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">Tahsilat: 190</text></g>
  </g>
</svg>