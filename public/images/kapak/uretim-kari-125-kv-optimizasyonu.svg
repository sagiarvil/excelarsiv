<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ÜRETİM &amp; STOK</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Uretim Kari 125 Kv Optimizasyonu</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(320, 60)"><rect x="0" y="0" width="280" height="130" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" /><text x="24" y="36" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="700">Yıllık Ciro</text><text x="24" y="84" fill="#0f172a" font-family="sans-serif" font-size="32" font-weight="900">₺12.4M</text><rect x="24" y="96" width="70" height="22" rx="11" fill="#ecfdf5" /><text x="59" y="112" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">+%18.4</text><rect x="310" y="0" width="280" height="130" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" /><text x="334" y="36" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="700">Faiz Öncesi Kâr</text><text x="334" y="84" fill="#0f172a" font-family="sans-serif" font-size="32" font-weight="900">₺2.8M</text><rect x="334" y="96" width="70" height="22" rx="11" fill="#ecfdf5" /><text x="369" y="112" fill="#059669" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">+%12.1</text><rect x="0" y="160" width="280" height="130" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" /><text x="24" y="196" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="700">Nakit Döngüsü</text><text x="24" y="244" fill="#0f172a" font-family="sans-serif" font-size="32" font-weight="900">42 Gün</text><rect x="24" y="256" width="70" height="22" rx="11" fill="#ecfdf5" /><text x="59" y="272" fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">-6 Gün</text><rect x="310" y="160" width="280" height="130" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" /><text x="334" y="196" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="700">Stok Devir Hızı</text><text x="334" y="244" fill="#0f172a" font-family="sans-serif" font-size="32" font-weight="900">6.4x</text><rect x="334" y="256" width="70" height="22" rx="11" fill="#ecfdf5" /><text x="369" y="272" fill="#8b5cf6" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">+0.8x</text></g>
  </g>
</svg>