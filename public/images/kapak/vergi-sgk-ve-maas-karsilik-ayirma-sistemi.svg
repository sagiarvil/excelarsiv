<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VERGİ &amp; MEVZUAT</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Vergi SGK &amp; Maas Karsilik Ayirma Sistemi</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g transform="translate(360, 80)"><line x1="0" y1="0" x2="520" y2="0" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="340" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="85" x2="520" y2="85" stroke="#e2e8f0" stroke-width="2"/><line x1="130" y1="0" x2="130" y2="340" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="170" x2="520" y2="170" stroke="#e2e8f0" stroke-width="2"/><line x1="260" y1="0" x2="260" y2="340" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="255" x2="520" y2="255" stroke="#e2e8f0" stroke-width="2"/><line x1="390" y1="0" x2="390" y2="340" stroke="#e2e8f0" stroke-width="2"/><line x1="0" y1="340" x2="520" y2="340" stroke="#e2e8f0" stroke-width="2"/><line x1="520" y1="0" x2="520" y2="340" stroke="#e2e8f0" stroke-width="2"/><circle cx="80" cy="280" r="16" fill="#10b981" opacity="0.85" stroke="#ffffff" stroke-width="3" /><circle cx="140" cy="210" r="24" fill="#059669" opacity="0.85" stroke="#ffffff" stroke-width="3" /><circle cx="220" cy="160" r="18" fill="#3b82f6" opacity="0.85" stroke="#ffffff" stroke-width="3" /><circle cx="310" cy="110" r="32" fill="#047857" opacity="0.85" stroke="#ffffff" stroke-width="3" /><circle cx="420" cy="70" r="22" fill="#f59e0b" opacity="0.85" stroke="#ffffff" stroke-width="3" /><circle cx="480" cy="50" r="28" fill="#10b981" opacity="0.85" stroke="#ffffff" stroke-width="3" /></g>
  </g>
</svg>