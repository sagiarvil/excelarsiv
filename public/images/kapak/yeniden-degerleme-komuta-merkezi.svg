<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="400" x2="1600" y2="400" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="800" x2="1600" y2="800" />
  </g>
  
  <!-- Main Presentation Card -->
  <rect x="180" y="110" width="1240" height="780" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Card Header -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="100" y="21" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VERGİ &amp; MEVZUAT</text>
    <text x="0" y="70" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Yeniden Degerleme Komuta Merkezi</text>
  </g>
  
  <!-- Chart Area (Centered) -->
  <g transform="translate(180, 230)">
    <g>
      <circle cx="620" cy="260" r="140" fill="none" stroke="#f1f5f9" stroke-width="22" />
      <circle cx="620" cy="260" r="190" fill="none" stroke="#f1f5f9" stroke-width="26" />
      <circle cx="620" cy="260" r="140" fill="none" stroke="#10b981" stroke-width="22" stroke-dasharray="879.645943005142" stroke-dashoffset="413.4335932124167" stroke-linecap="round" transform="rotate(-90 620 260)" />
      <circle cx="620" cy="260" r="190" fill="none" stroke="#047857" stroke-width="26" stroke-dasharray="1193.8052083641214" stroke-dashoffset="608.8406562657019" stroke-linecap="round" transform="rotate(-90 620 260)" />
      <text x="620" y="278" fill="#0f172a" font-family="sans-serif" font-size="64" font-weight="900" text-anchor="middle">%53</text>
      <text x="620" y="314" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">GERÇEKLEŞME ORANI</text>
    </g>
  </g>
</svg>